function el(id) { return document.getElementById(id); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function shade(hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  let r = parseInt(c.substr(0, 2), 16);
  let gg = parseInt(c.substr(2, 2), 16);
  let b = parseInt(c.substr(4, 2), 16);
  if (amt > 0) {
    r = Math.round(r + (255 - r) * amt);
    gg = Math.round(gg + (255 - gg) * amt);
    b = Math.round(b + (255 - b) * amt);
  } else {
    r = Math.round(r * (1 + amt));
    gg = Math.round(gg * (1 + amt));
    b = Math.round(b * (1 + amt));
  }
  return 'rgb(' + clamp(r, 0, 255) + ',' + clamp(gg, 0, 255) + ',' + clamp(b, 0, 255) + ')';
}

function drawSky() {
  const hz = horizonY();
  const grad = g.createLinearGradient(0, 0, 0, Math.max(hz, 1));
  grad.addColorStop(0, '#0e1c2e');
  grad.addColorStop(0.45, '#20405e');
  grad.addColorStop(0.85, '#5c86a6');
  grad.addColorStop(1, '#9db8c9');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, Math.max(hz, 1));

  // 雲
  g.save();
  g.globalAlpha = 0.14;
  g.fillStyle = '#ffffff';
  for (let i = 0; i < 12; i++) {
    const cx = ((i * 383 + cam.yaw * 300) % (W + 600)) - 300;
    const cy = 30 + ((i * 71) % Math.max(50, hz * 0.75));
    const rw = 130 + (i % 4) * 70;
    g.beginPath();
    g.ellipse(cx, cy, rw, rw * 0.24, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();

  // 遠景の山並み
  g.save();
  g.fillStyle = 'rgba(26,54,40,0.78)';
  g.beginPath();
  g.moveTo(0, hz + 8);
  for (let x = 0; x <= W; x += 32) {
    const y = hz + 4 - Math.sin((x + cam.yaw * 520) * 0.0032) * 34
                    - Math.cos(x * 0.0081) * 15
                    - Math.sin(x * 0.019) * 5;
    g.lineTo(x, y);
  }
  g.lineTo(W, hz + 40);
  g.lineTo(0, hz + 40);
  g.closePath();
  g.fill();
  g.restore();

  // スタンド（簡易）
  g.save();
  g.globalAlpha = 0.5;
  g.fillStyle = '#233240';
  const stY = hz - 46;
  for (let i = 0; i < 4; i++) {
    g.fillRect(0, stY + i * 12, W, 7);
  }
  g.restore();
}

function drawGround() {
  const hz = horizonY();
  const top = Math.max(0, hz);
  const gd = g.createLinearGradient(0, top, 0, H);
  gd.addColorStop(0, '#3c6f34');
  gd.addColorStop(0.35, '#2e5c29');
  gd.addColorStop(1, '#1d3a1b');
  g.fillStyle = gd;
  g.fillRect(0, top, W, H - top);
}

function drawTrackBand(offInner, offOuter, color, yTop) {
  const step = 200;
  const y = (yTop === undefined) ? 0.8 : yTop;
  const outerPts = [], innerPts = [];
  for (let d = 0; d <= totalDistance; d += step) {
    const po = getTrackPos(d, offOuter);
    const pi = getTrackPos(d, offInner);
    outerPts.push(project(po.x, y, po.z));
    innerPts.push(project(pi.x, y, pi.z));
  }
  g.beginPath();
  let drew = false;
  for (let k = 0; k < outerPts.length - 1; k++) {
    const a = outerPts[k], b = outerPts[k + 1];
    const ca = innerPts[k], cb = innerPts[k + 1];
    if (!a || !b || !ca || !cb) continue;
    g.moveTo(a.x, a.y);
    g.lineTo(b.x, b.y);
    g.lineTo(cb.x, cb.y);
    g.lineTo(ca.x, ca.y);
    g.closePath();
    drew = true;
  }
  if (drew) { g.fillStyle = color; g.fill(); }
}

function drawTrackSurface() {
  drawTrackBand(-1500, 1500, '#2f6d2c');    // 外周芝
  drawTrackBand(-260, 260, '#b98a5c');      // ダート
  drawTrackBand(-274, -260, '#eef2f5');     // 内ラチ
  drawTrackBand(260, 274, '#eef2f5');       // 外ラチ
}

function drawTrackLines() {
  const line = function (d, color, wdt) {
    const a = getTrackPos(d, -258);
    const b = getTrackPos(d, 258);
    const pa = project(a.x, 1.2, a.z);
    const pb = project(b.x, 1.2, b.z);
    if (!pa || !pb) return;
    g.strokeStyle = color;
    g.lineWidth = Math.max(1, wdt * pa.s * 0.0016 + 0.8);
    g.beginPath();
    g.moveTo(pa.x, pa.y);
    g.lineTo(pb.x, pb.y);
    g.stroke();
  };
  line(0, 'rgba(255,255,255,0.9)', 7);
  line(totalDistance, 'rgba(229,57,53,0.95)', 9);
  for (let d = 1000; d < totalDistance; d += 1000) line(d, 'rgba(255,255,255,0.18)', 3);
}

function drawFencePosts() {
  const posts = [];
  for (let d = 0; d <= totalDistance; d += 420) {
    for (const side of [-1, 1]) {
      const p = getTrackPos(d, side * 282);
      const pt = project(p.x, 8, p.z);
      if (pt) posts.push(pt);
    }
  }
  posts.sort(function (a, b) { return b.d - a.d; });
  for (const pt of posts) {
    const hh = clamp(pt.s * 22, 2, 90);
    const ww = Math.max(1, clamp(pt.s * 2.4, 0.8, 6));
    g.fillStyle = 'rgba(236,239,241,0.88)';
    g.fillRect(pt.x - ww / 2, pt.y - hh, ww, hh);
  }
}

function drawGate(d, open) {
  const p = getTrackPos(d, 0);
  const left = getTrackPos(d, -300);
  const right = getTrackPos(d, 300);
  const a = project(left.x, 0, left.z);
  const b = project(right.x, 0, right.z);
  const at = project(left.x, 150, left.z);
  const bt = project(right.x, 150, right.z);
  const c = project(p.x, 0, p.z);
  if (!a || !b || !c) return;
  const sc = c.s;

  // 支柱
  if (at && bt) {
    g.strokeStyle = '#263238';
    g.lineWidth = Math.max(1.5, clamp(sc * 5, 1.5, 60));
    g.beginPath();
    g.moveTo(a.x, a.y); g.lineTo(at.x, at.y);
    g.moveTo(b.x, b.y); g.lineTo(bt.x, bt.y);
    g.stroke();

    // 上枠
    g.strokeStyle = '#37474f';
    g.lineWidth = Math.max(1.5, clamp(sc * 4, 1.5, 50));
    g.beginPath();
    g.moveTo(at.x, at.y); g.lineTo(bt.x, bt.y);
    g.stroke();
  }

  // 各馬のゲート扉
  for (let i = 0; i < numHorses; i++) {
    const lane = -160 + (320 / (numHorses - 1)) * i;
    const q = getTrackPos(d, lane);
    const base = project(q.x, 0, q.z);
    const top = project(q.x, 105, q.z);
    if (!base || !top) continue;
    const w = Math.max(1.2, base.s * 9);
    // 扉（開くと横に寝る）
    const opened = open ? 1 : 0;
    g.save();
    g.strokeStyle = 'rgba(207,216,220,0.9)';
    g.lineWidth = Math.max(1, base.s * 1.1);
    g.beginPath();
    g.moveTo(base.x - w, base.y);
    g.lineTo(base.x - w * (1 - opened * 0.85), top.y + (base.y - top.y) * opened * 0.15);
    g.stroke();
    g.beginPath();
    g.moveTo(base.x + w, base.y);
    g.lineTo(base.x + w * (1 - opened * 0.85), top.y + (base.y - top.y) * opened * 0.15);
    g.stroke();
    g.restore();
  }
}

// ============================================================
//  馬体（横から見たリアル寄りのシルエット）
//  ローカル座標: +x = 進行方向, -y = 上。y=0 が地面。
//  L = 体長の基準スケール
// ============================================================
function limbSeg(x1, y1, x2, y2, w1, w2, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(x1 + nx * w1, y1 + ny * w1);
  g.lineTo(x2 + nx * w2, y2 + ny * w2);
  g.lineTo(x2 - nx * w2, y2 - ny * w2);
  g.lineTo(x1 - nx * w1, y1 - ny * w1);
  g.closePath();
  g.fill();
  // 丸みを補う
  g.beginPath();
  g.arc(x2, y2, w2, 0, Math.PI * 2);
  g.fill();
}

// 脚1本を順運動学で描く
// hipA/kneeA/fetA : 付け根からの角度(rad, 0=真下, +が前)
function drawLegChain(x0, y0, hipA, kneeA, fetA, cfg, coat, L, isFront) {
  const upper = cfg.upper * L, lower = cfg.lower * L, cannon = cfg.cannon * L;
  const wU = cfg.wUpper * L, wL = cfg.wLower * L, wC = cfg.wCannon * L;

  let px = x0 * L, py = y0 * L;
  const a1 = hipA;
  const j1x = px + Math.sin(a1) * upper, j1y = py + Math.cos(a1) * upper;
  const a2 = a1 + kneeA;
  const j2x = j1x + Math.sin(a2) * lower, j2y = j1y + Math.cos(a2) * lower;
  const a3 = a2 + fetA;
  const j3x = j2x + Math.sin(a3) * cannon, j3y = j2y + Math.cos(a3) * cannon;

  const upperCol  = coat;
  const lowerCol  = shade(coat, -0.20);
  const cannonCol = shade(coat, -0.48);

  limbSeg(px, py, j1x, j1y, wU, wU * 0.62, upperCol);
  limbSeg(j1x, j1y, j2x, j2y, wL, wL * 0.72, lowerCol);
  limbSeg(j2x, j2y, j3x, j3y, wC, wC * 0.92, cannonCol);

  // 蹄（角度に合わせて）
  g.save();
  g.translate(j3x, j3y);
  g.rotate(-a3);
  const hoofW = wC * 2.4, hoofH = wC * 2.0;
  g.fillStyle = '#26211d';
  g.beginPath();
  g.moveTo(-hoofW, 0);
  g.lineTo(hoofW, 0);
  g.lineTo(hoofW * 0.78, hoofH);
  g.lineTo(-hoofW * 0.82, hoofH);
  g.closePath();
  g.fill();
  g.fillStyle = 'rgba(255,255,255,0.14)';
  g.beginPath();
  g.moveTo(-hoofW, 0);
  g.lineTo(hoofW, 0);
  g.lineTo(hoofW * 0.9, hoofH * 0.22);
  g.lineTo(-hoofW * 0.92, hoofH * 0.22);
  g.closePath();
  g.fill();
  g.restore();
}

// ------------------------------------------------------------
// 馬体本体
// ------------------------------------------------------------
function drawHorseBody(L, phase, moving, coat, silk, opts) {
  opts = opts || {};
  const dark  = shade(coat, -0.40);
  const mid   = shade(coat, -0.12);
  const light = shade(coat, 0.26);
  const t = phase;
  const gallop = !!opts.gallop;

  // ---- 歩様（フーリエ合成で滑らかに） ----
  const AMP = gallop ? 0.92 : 0.44;
  const kneeAmp = gallop ? 1.30 : 0.52;

  // ギャロップは「後→後→前→前」、常歩は対角
  const ph = gallop
    ? { nH: 0.0, oH: Math.PI * 0.62, oF: Math.PI * 1.18, nF: Math.PI * 1.72 }
    : { oH: 0.0, nH: Math.PI, oF: Math.PI * 0.5, nF: Math.PI * 1.5 };

  function hip(o)  { return moving ? Math.sin(t + o) * AMP : 0.03; }
  function knee(o) {
    if (!moving) return -0.04;
    const s = Math.sin(t + o + 1.25);
    return Math.max(0, s) * kneeAmp;   // 前方に折れる
  }
  function fet(o) {
    if (!moving) return 0.02;
    const s = Math.sin(t + o + 2.1);
    return Math.max(0, s) * (gallop ? 0.55 : 0.22);
  }

  // ---- 胴の上下動・ピッチ ----
  const bob   = moving ? Math.sin(t * 2) * (gallop ? 0.040 : 0.014) * L : 0;
  const pitch = moving ? Math.cos(t) * (gallop ? 0.085 : 0.018) : 0;

  // 前脚・後脚の寸法（L=1 基準）
  const FORE = { upper: 0.235, lower: 0.115, cannon: 0.125,
                 wUpper: 0.052, wLower: 0.030, wCannon: 0.019 };
  const HIND = { upper: 0.255, lower: 0.135, cannon: 0.120,
                 wUpper: 0.070, wLower: 0.038, wCannon: 0.021 };

  // 付け根の位置
  const SHOULDER = { x: 0.255, y: -0.455 };
  const HIP      = { x: -0.335, y: -0.505 };

  // ============ 奥側の脚 ============
  g.save();
  g.globalAlpha = 0.55;
  drawLegChain(SHOULDER.x - 0.035, SHOULDER.y, hip(ph.oF), -knee(ph.oF), fet(ph.oF), FORE, dark, L, true);
  drawLegChain(HIP.x - 0.030, HIP.y, hip(ph.oH), -knee(ph.oH) * 0.9, fet(ph.oH), HIND, dark, L, false);
  g.restore();

  // ============ 胴体 ============
  g.save();
  g.translate(0, bob);
  g.rotate(pitch);

  // バレル
  const bodyGrad = g.createLinearGradient(0, -0.82 * L, 0, -0.30 * L);
  bodyGrad.addColorStop(0, light);
  bodyGrad.addColorStop(0.38, coat);
  bodyGrad.addColorStop(1, mid);
  g.fillStyle = bodyGrad;

  const BL = L;   // 短縮
  g.beginPath();
  // 胸前
  g.moveTo(0.300 * BL, -0.735 * BL);
  g.bezierCurveTo(0.360 * BL, -0.660 * BL, 0.375 * BL, -0.560 * BL, 0.355 * BL, -0.470 * BL);
  // 前胸部の丸み
  g.bezierCurveTo(0.345 * BL, -0.400 * BL, 0.310 * BL, -0.355 * BL, 0.250 * BL, -0.330 * BL);
  // 腹
  g.bezierCurveTo(0.130 * BL, -0.300 * BL, -0.030 * BL, -0.300 * BL, -0.160 * BL, -0.330 * BL);
  // 後腹〜脇腹
  g.bezierCurveTo(-0.270 * BL, -0.355 * BL, -0.380 * BL, -0.420 * BL, -0.440 * BL, -0.520 * BL);
  // 尻
  g.bezierCurveTo(-0.500 * BL, -0.610 * BL, -0.520 * BL, -0.720 * BL, -0.470 * BL, -0.775 * BL);
  // 腰
  g.bezierCurveTo(-0.400 * BL, -0.815 * BL, -0.255 * BL, -0.822 * BL, -0.120 * BL, -0.812 * BL);
  // 背
  g.bezierCurveTo(0.010 * BL, -0.805 * BL, 0.150 * BL, -0.795 * BL, 0.245 * BL, -0.778 * BL);
  // 肩〜胸前へ戻る
  g.bezierCurveTo(0.290 * BL, -0.770 * BL, 0.298 * BL, -0.752 * BL, 0.300 * BL, -0.735 * BL);
  g.closePath();
  g.fill();

  // 腹側の陰影
  g.save();
  g.globalAlpha = 0.20;
  g.fillStyle = dark;
  g.beginPath();
  g.moveTo(0.240 * BL, -0.340 * BL);
  g.bezierCurveTo(0.100 * BL, -0.302 * BL, -0.080 * BL, -0.302 * BL, -0.230 * BL, -0.348 * BL);
  g.bezierCurveTo(-0.120 * BL, -0.330 * BL, 0.080 * BL, -0.328 * BL, 0.240 * BL, -0.340 * BL);
  g.closePath();
  g.fill();
  g.restore();

  // 肩の筋肉
  g.save();
  g.globalAlpha = 0.18;
  g.fillStyle = light;
  g.beginPath();
  g.ellipse(0.215 * BL, -0.610 * BL, 0.105 * BL, 0.115 * BL, -0.35, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // 臀部の筋肉（大腿）
  g.save();
  g.globalAlpha = 0.20;
  g.fillStyle = light;
  g.beginPath();
  g.ellipse(-0.360 * BL, -0.660 * BL, 0.115 * BL, 0.125 * BL, 0.22, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // 肋骨のさざなみ
  g.save();
  g.globalAlpha = 0.10;
  g.strokeStyle = dark;
  g.lineWidth = 0.008 * BL;
  for (let r = 0; r < 5; r++) {
    const rx = (0.12 - r * 0.075) * BL;
    g.beginPath();
    g.moveTo(rx, -0.760 * BL);
    g.quadraticCurveTo(rx - 0.045 * BL, -0.560 * BL, rx - 0.012 * BL, -0.330 * BL);
    g.stroke();
  }
  g.restore();

  // ============ 首 ============
  // ギャロップ時は首を前方へ伸ばす
  const neckFwd = moving ? (gallop ? 1.0 : 0.45) : 0.25;
  const pollX = 0.245 + 0.205 * neckFwd;
  const pollY = -0.790 - (gallop ? 0.175 : 0.245) + (gallop ? 0.06 : 0);

  const neckGrad = g.createLinearGradient(0.20 * BL, -0.78 * BL, pollX * BL, pollY * BL);
  neckGrad.addColorStop(0, mid);
  neckGrad.addColorStop(0.55, coat);
  neckGrad.addColorStop(1, light);
  g.fillStyle = neckGrad;

  g.beginPath();
  // 首の下縁（喉側）
  g.moveTo(0.300 * BL, -0.700 * BL);
  g.bezierCurveTo(0.360 * BL, -0.800 * BL, pollX * 0.90 * BL, pollY * 0.965 * BL,
                  pollX * BL, pollY * BL + 0.030 * BL);
  // 頭の付け根
  g.bezierCurveTo(pollX * BL + 0.045 * BL, pollY * BL + 0.055 * BL,
                  pollX * BL + 0.055 * BL, pollY * BL + 0.090 * BL,
                  pollX * BL + 0.040 * BL, pollY * BL + 0.130 * BL);
  // 首の上縁（項側）へ戻る
  g.bezierCurveTo((pollX - 0.09) * BL, pollY * BL + 0.155 * BL,
                  0.215 * BL, -0.795 * BL, 0.245 * BL, -0.780 * BL);
  g.closePath();
  g.fill();

  // ============ 頭 ============
  g.save();
  g.translate(pollX * BL, pollY * BL);
  const headAngle = gallop ? 0.92 : 0.62;
  g.rotate(headAngle);

  const HL = L * 0.86;   // 頭のスケール

  // 頭蓋
  g.fillStyle = coat;
  g.beginPath();
  g.ellipse(0.0, 0.0, 0.088 * HL, 0.078 * HL, 0, 0, Math.PI * 2);
  g.fill();

  // 鼻梁〜鼻先（長い楔形）
  g.beginPath();
  g.moveTo(-0.020 * HL, -0.068 * HL);
  g.bezierCurveTo(0.090 * HL, -0.052 * HL, 0.185 * HL, -0.036 * HL, 0.215 * HL, -0.018 * HL);
  g.bezierCurveTo(0.230 * HL, -0.004 * HL, 0.230 * HL, 0.018 * HL, 0.212 * HL, 0.032 * HL);
  g.bezierCurveTo(0.170 * HL, 0.056 * HL, 0.075 * HL, 0.076 * HL, -0.020 * HL, 0.082 * HL);
  g.closePath();
  g.fill();

  // 鼻先（暗色）
  g.fillStyle = dark;
  g.beginPath();
  g.ellipse(0.205 * HL, 0.008 * HL, 0.030 * HL, 0.030 * HL, 0.15, 0, Math.PI * 2);
  g.fill();
  // 鼻孔
  g.fillStyle = '#0d0a08';
  g.beginPath();
  g.ellipse(0.208 * HL, -0.004 * HL, 0.010 * HL, 0.013 * HL, 0.3, 0, Math.PI * 2);
  g.fill();

  // 下顎（ガナッシュ）
  g.fillStyle = mid;
  g.beginPath();
  g.ellipse(0.075 * HL, 0.062 * HL, 0.088 * HL, 0.042 * HL, 0.16, 0, Math.PI * 2);
  g.fill();

  // 頬（えら）
  g.fillStyle = shade(coat, -0.18);
  g.beginPath();
  g.ellipse(0.010 * HL, 0.020 * HL, 0.062 * HL, 0.062 * HL, 0.2, 0, Math.PI * 2);
  g.fill();

  // 目
  g.fillStyle = '#0a0806';
  g.beginPath();
  g.ellipse(0.052 * HL, -0.036 * HL, 0.016 * HL, 0.014 * HL, -0.2, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = 'rgba(255,255,255,0.80)';
  g.beginPath();
  g.arc(0.058 * HL, -0.041 * HL, 0.0055 * HL, 0, Math.PI * 2);
  g.fill();
  // 眼球のまわりの窪み
  g.save();
  g.globalAlpha = 0.25;
  g.fillStyle = dark;
  g.beginPath();
  g.ellipse(0.052 * HL, -0.034 * HL, 0.028 * HL, 0.024 * HL, -0.2, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // 耳（2枚）
  g.fillStyle = coat;
  g.beginPath();
  g.moveTo(-0.055 * HL, -0.062 * HL);
  g.lineTo(-0.082 * HL, -0.125 * HL);
  g.lineTo(-0.024 * HL, -0.070 * HL);
  g.closePath();
  g.fill();
  g.beginPath();
  g.moveTo(-0.018 * HL, -0.072 * HL);
  g.lineTo(-0.022 * HL, -0.130 * HL);
  g.lineTo(0.014 * HL, -0.066 * HL);
  g.closePath();
  g.fill();
  // 耳の内側
  g.fillStyle = shade(coat, -0.32);
  g.beginPath();
  g.moveTo(-0.048 * HL, -0.068 * HL);
  g.lineTo(-0.066 * HL, -0.110 * HL);
  g.lineTo(-0.032 * HL, -0.072 * HL);
  g.closePath();
  g.fill();

  // 頭絡（ハミ・頬革）
  g.strokeStyle = '#3a2d22';
  g.lineWidth = 0.016 * HL;
  g.beginPath();
  g.moveTo(0.160 * HL, -0.028 * HL);
  g.lineTo(0.162 * HL, 0.030 * HL);
  g.stroke();
  g.lineWidth = 0.013 * HL;
  g.beginPath();
  g.moveTo(0.048 * HL, -0.060 * HL);
  g.quadraticCurveTo(0.110 * HL, 0.000 * HL, 0.160 * HL, 0.010 * HL);
  g.stroke();

  g.restore();

  // ============ タテガミ ============
  g.fillStyle = dark;
  g.beginPath();
  g.moveTo(0.245 * BL, -0.782 * BL);
  g.bezierCurveTo(0.270 * BL, -0.845 * BL, pollX * 0.86 * BL, pollY * 0.975 * BL,
                  pollX * BL, pollY * BL + 0.008 * BL);
  g.bezierCurveTo(pollX * 0.92 * BL, pollY * BL + 0.075 * BL,
                  0.275 * BL, -0.830 * BL, 0.268 * BL, -0.760 * BL);
  g.closePath();
  g.fill();

  if (moving) {
    g.strokeStyle = dark;
    g.lineWidth = 0.010 * L;
    g.lineCap = 'round';
    for (let m = 0; m < 7; m++) {
      const u = m / 7;
      const bx = lerp(0.250, pollX, u) * BL;
      const by = lerp(-0.790, pollY + 0.015, u) * BL;
      const wav = Math.sin(t * 2.4 + m * 0.9) * 0.022;
      g.beginPath();
      g.moveTo(bx, by);
      g.quadraticCurveTo(bx - 0.030 * L, by + 0.030 * L,
                         bx - 0.055 * L + wav * L, by + 0.075 * L);
      g.stroke();
    }
  }

  // ============ 尻尾 ============
  const tailSwing = moving ? Math.sin(t * 1.5) * (gallop ? 0.30 : 0.12) : Math.sin(t * 0.35) * 0.05;
  g.save();
  g.translate(-0.455 * BL, -0.770 * BL);
  g.rotate(0.38 + tailSwing);
  const tailGrad = g.createLinearGradient(0, 0, -0.10 * BL, 0.55 * BL);
  tailGrad.addColorStop(0, mid);
  tailGrad.addColorStop(0.45, dark);
  tailGrad.addColorStop(1, shade(coat, -0.55));
  g.fillStyle = tailGrad;
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(-0.085 * BL, 0.120 * BL, -0.160 * BL, 0.320 * BL, -0.130 * BL, 0.540 * BL);
  g.bezierCurveTo(-0.060 * BL, 0.400 * BL, 0.010 * BL, 0.230 * BL, 0.055 * BL, 0.045 * BL);
  g.closePath();
  g.fill();
  // 尾の毛束
  g.strokeStyle = shade(coat, -0.60);
  g.lineWidth = 0.012 * L;
  g.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    g.beginPath();
    g.moveTo(-0.020 * L, 0.100 * L);
    g.quadraticCurveTo((-0.090 - k * 0.012) * L, (0.280 + k * 0.03) * L,
                       (-0.105 - k * 0.018) * L, (0.470 + k * 0.02) * L);
    g.stroke();
  }
  g.restore();

  // ============ 鞍（ゼッケン付き） ============
  g.fillStyle = '#3b2a1c';
  g.beginPath();
  g.moveTo(-0.170 * BL, -0.800 * BL);
  g.quadraticCurveTo(0.000 * BL, -0.868 * BL, 0.150 * BL, -0.792 * BL);
  g.quadraticCurveTo(0.020 * BL, -0.740 * BL, -0.100 * BL, -0.762 * BL);
  g.closePath();
  g.fill();
  // 鞍の座面
  g.fillStyle = '#120c08';
  g.beginPath();
  g.ellipse(-0.020 * BL, -0.812 * BL, 0.115 * BL, 0.032 * BL, -0.03, 0, Math.PI * 2);
  g.fill();
  // ゼッケン（番号）
  g.fillStyle = '#f5f5f5';
  g.beginPath();
  g.roundRect(-0.130 * BL, -0.760 * BL, 0.070 * BL, 0.058 * BL, 0.010 * BL);
  g.fill();
  // 腹帯
  g.strokeStyle = '#2b1e14';
  g.lineWidth = 0.026 * BL;
  g.beginPath();
  g.moveTo(0.115 * BL, -0.780 * BL);
  g.quadraticCurveTo(0.130 * BL, -0.520 * BL, 0.095 * BL, -0.318 * BL);
  g.stroke();
  // 鐙
  g.strokeStyle = '#4e342e';
  g.lineWidth = 0.014 * BL;
  g.beginPath();
  g.moveTo(0.070 * BL, -0.760 * BL);
  g.lineTo(0.090 * BL, -0.500 * BL);
  g.stroke();
  g.fillStyle = '#616161';
  g.beginPath();
  g.ellipse(0.092 * BL, -0.492 * BL, 0.020 * BL, 0.012 * BL, 0, 0, Math.PI * 2);
  g.fill();

  // ============ 手前側の脚 ============
  drawLegChain(SHOULDER.x + 0.020, SHOULDER.y, hip(ph.nF), -knee(ph.nF), fet(ph.nF), FORE, coat, L, true);
  drawLegChain(HIP.x + 0.022, HIP.y, hip(ph.nH), -knee(ph.nH) * 0.9, fet(ph.nH), HIND, coat, L, false);

  // ============ ジョッキー ============
  drawJockey(L, silk, t, moving, gallop, pollX, pollY);

  g.restore();
}

// ジョッキー（モンキー乗り）
function drawJockey(L, silk, t, moving, gallop, pollX, pollY) {
  const seatX = -0.025 * L;
  const seatY = -0.845 * L;
  const lean = moving ? (gallop ? 0.78 : 0.40) + Math.sin(t) * 0.045 : 0.24;

  g.save();
  g.translate(seatX, seatY);
  g.rotate(-lean);

  const sDark = shade(silk, -0.24);
  const sLight = shade(silk, 0.24);

  // 脚（鐙へ）— 体より先に描いて奥行き
  g.strokeStyle = '#fafafa';
  g.lineWidth = 0.040 * L;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-0.020 * L, 0.010 * L);
  g.quadraticCurveTo(-0.005 * L, 0.090 * L, 0.048 * L, 0.140 * L);
  g.stroke();
  g.strokeStyle = '#212121';
  g.lineWidth = 0.032 * L;
  g.beginPath();
  g.moveTo(0.048 * L, 0.140 * L);
  g.lineTo(0.082 * L, 0.192 * L);
  g.stroke();
  g.fillStyle = '#1a1a1a';
  g.beginPath();
  g.ellipse(0.092 * L, 0.202 * L, 0.030 * L, 0.016 * L, 0.42, 0, Math.PI * 2);
  g.fill();

  // 胴（勝負服）
  const grad = g.createLinearGradient(0, -0.235 * L, 0, 0.020 * L);
  grad.addColorStop(0, sLight);
  grad.addColorStop(0.55, silk);
  grad.addColorStop(1, sDark);
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(-0.070 * L, 0.005 * L);
  g.bezierCurveTo(-0.090 * L, -0.090 * L, -0.062 * L, -0.165 * L, -0.020 * L, -0.190 * L);
  g.bezierCurveTo(0.020 * L, -0.212 * L, 0.062 * L, -0.180 * L, 0.078 * L, -0.130 * L);
  g.bezierCurveTo(0.090 * L, -0.080 * L, 0.080 * L, -0.030 * L, 0.070 * L, 0.005 * L);
  g.closePath();
  g.fill();

  // ゼッケン（背番号帯）
  g.fillStyle = 'rgba(255,255,255,0.90)';
  g.beginPath();
  g.roundRect(-0.048 * L, -0.140 * L, 0.036 * L, 0.080 * L, 0.008 * L);
  g.fill();

  // 腕（手綱へ）
  g.strokeStyle = shade(silk, 0.02);
  g.lineWidth = 0.038 * L;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(0.030 * L, -0.155 * L);
  g.quadraticCurveTo(0.100 * L, -0.130 * L, 0.150 * L, -0.062 * L);
  g.stroke();

  // 手綱
  g.strokeStyle = '#3a2d22';
  g.lineWidth = 0.009 * L;
  g.beginPath();
  g.moveTo(0.152 * L, -0.056 * L);
  g.quadraticCurveTo((pollX + 0.10) * L, (pollY + 0.30) * L, (pollX + 0.14) * L, (pollY + 0.14) * L);
  g.stroke();

  // 手
  g.fillStyle = '#e8bd94';
  g.beginPath();
  g.arc(0.156 * L, -0.052 * L, 0.023 * L, 0, Math.PI * 2);
  g.fill();

  // 頭（ヘルメット＋ゴーグル）
  g.save();
  g.translate(0.062 * L, -0.238 * L);
  g.rotate(lean * 0.5);

  // 帽体
  g.fillStyle = sLight;
  g.beginPath();
  g.arc(0, 0, 0.055 * L, Math.PI * 1.00, Math.PI * 2.00);
  g.closePath();
  g.fill();
  // つば
  g.fillStyle = shade(silk, 0.42);
  g.beginPath();
  g.ellipse(0.030 * L, 0.002 * L, 0.052 * L, 0.013 * L, -0.12, 0, Math.PI * 2);
  g.fill();
  // 頬
  g.fillStyle = '#e8bd94';
  g.beginPath();
  g.ellipse(0.004 * L, 0.024 * L, 0.036 * L, 0.030 * L, 0, 0, Math.PI * 2);
  g.fill();
  // ゴーグル
  g.fillStyle = 'rgba(180,225,255,0.90)';
  g.beginPath();
  g.ellipse(0.020 * L, 0.016 * L, 0.036 * L, 0.020 * L, 0.08, 0, Math.PI * 2);
  g.fill();
  g.strokeStyle = '#37474f';
  g.lineWidth = 0.008 * L;
  g.stroke();
  // ゴーグルの反射
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.beginPath();
  g.ellipse(0.008 * L, 0.010 * L, 0.011 * L, 0.006 * L, 0.2, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // ムチ（右手）
  if (moving) {
    const whipOut = Math.max(0, Math.sin(t * 1.9)) ;
    g.strokeStyle = '#c62828';
    g.lineWidth = 0.012 * L;
    g.beginPath();
    g.moveTo(0.040 * L, -0.120 * L);
    g.lineTo((0.105 + whipOut * 0.075) * L, (-0.185 - whipOut * 0.075) * L);
    g.stroke();
  }

  g.restore();
}

// 全馬描画
function drawHorses() {
  // カメラの基底（project と同じ定義）
  const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw);
  const cpw = Math.cos(cam.pitch), spw = Math.sin(cam.pitch);
  const camRx = cyw,  camRz = -syw;
  const camFx = syw * cpw, camFz = cyw * cpw;

  const list = [];
  for (let i = 0; i < horses.length; i++) {
    const h = horses[i];
    if (!h.isParticipating) continue;
    const p = getTrackPos(h.d, h.laneOffset);
    const pr = project(p.x, 0, p.z);
    if (!pr) continue;

    // 馬の向き＝コースの接線方向（カメラ右方向への成分で判定）
    const dir = travelDir(h.d);
    const dotR = dir.x * camRx + dir.z * camRz;   // 画面右への成分
    const dotF = dir.x * camFx + dir.z * camFz;   // 奥行き成分

    // 正対（dotR≈0）のときに向きがパタつかんよう、前回の向きを保持する
    if (h._facing === undefined) h._facing = dotR >= 0 ? 1 : -1;
    else if (Math.abs(dotR) > 0.12) h._facing = dotR >= 0 ? 1 : -1;

    list.push({
      h: h,
      pr: pr,
      facing: h._facing,
      // 真横=1.0 / 正対=0.34 で体長を縮める（遠近の見え方）
      squash: clamp(Math.abs(dotR) * 1.12, 0.34, 1),
      scaleF: clamp(1 + dotF * 0.05, 0.95, 1.05),
      d: pr.d
    });
  }
  list.sort(function (a, b) { return b.d - a.d; });

  for (const o of list) {
    const h = o.h;
    const L = clamp(o.pr.s * 46 * o.scaleF, 11, 700);
    const moving = h.speed > 0.6;
    const gallop = h.speed > 7.5;

    g.save();
    g.translate(o.pr.x, o.pr.y);

    // 影
    g.save();
    g.globalAlpha = 0.32;
    g.fillStyle = '#000';
    g.beginPath();
    g.ellipse(0, 0, L * 0.46 * o.squash, L * 0.075, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();

    // スキル発光
    if (h.skillTimer > 0) {
      g.save();
      g.globalAlpha = 0.28 + Math.sin(performance.now() * 0.012) * 0.16;
      const rg = g.createRadialGradient(0, -L * 0.5, 0, 0, -L * 0.5, L * 0.85);
      rg.addColorStop(0, 'rgba(255,214,64,0.95)');
      rg.addColorStop(1, 'rgba(255,214,64,0)');
      g.fillStyle = rg;
      g.beginPath();
      g.arc(0, -L * 0.5, L * 0.85, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    // 馬体（進行方向がカメラに正対するほど横に縮む）
    g.save();
    g.scale(o.facing * o.squash, 1);
    drawHorseBody(L, h.legAngle, moving, h.coat || '#8d5524', h.silk || '#e53935',
      { gallop: gallop });
    g.restore();

    // 馬番＋馬名
    if (o.pr.s > 18) {
      const fs = clamp(o.pr.s * 0.9, 9, 15);
      g.save();
      g.font = 'bold ' + fs + 'px sans-serif';
      g.textAlign = 'center';
      const label = h.id + ' ' + h.name;
      const tw = g.measureText(label).width;
      g.fillStyle = 'rgba(0,0,0,0.62)';
      g.fillRect(-tw / 2 - 5, L * 0.06, tw + 10, fs * 1.45);
      g.fillStyle = h.isMyHorse ? '#ffd23f' : '#eceff1';
      g.fillText(label, 0, L * 0.06 + fs * 1.1);
      g.restore();
    }

    g.restore();
  }
}

function drawDust() {
  for (const h of horses) {
    if (!h.isParticipating || h.dustTimer <= 0) continue;
    const p = getTrackPos(h.d - 90, h.laneOffset);
    const pr = project(p.x, 8, p.z);
    if (!pr) continue;
    g.save();
    g.globalAlpha = clamp(h.dustTimer / 90, 0, 1) * 0.45;
    g.fillStyle = '#d7c6a8';
    const L = clamp(pr.s * 30, 8, 300);
    for (let i = 0; i < 5; i++) {
      const ox = Math.sin(i * 2.1 + h.d * 0.012) * L * 0.26;
      const oy = -Math.abs(Math.cos(i * 1.7 + h.d * 0.014)) * L * 0.26;
      g.beginPath();
      g.arc(pr.x + ox, pr.y + oy, L * (0.06 + i * 0.018), 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }
}

function drawPodiumFx() {
  const t = (performance.now() - podiumStartTime) * 0.001;
  g.save();
  const grad = g.createLinearGradient(0, H * 0.25, 0, H);
  grad.addColorStop(0, 'rgba(255,210,63,0)');
  grad.addColorStop(1, 'rgba(255,150,0,0.20)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const seed = i * 137.5;
    const x = (seed * 7 + t * 70) % W;
    const y = (seed * 11 + t * 160) % H;
    const s = 3 + (i % 5) * 2;
    g.fillStyle = ['#ffd23f', '#4dd0e1', '#ef5350', '#66bb6a'][i % 4];
    g.globalAlpha = 0.55;
    g.fillRect(x, y, s, s * 2);
  }
  g.restore();
}

// ------------------------------------------------------------
// 10. カメラ（元仕様のカメラワークを2D投影で再現）
// ------------------------------------------------------------
function lookAtCam(cx, cy, cz, tx, ty, tz) {
  cam.x = cx; cam.y = cy; cam.z = cz;
  const dx = tx - cx, dy = ty - cy, dz = tz - cz;
  const dh = Math.hypot(dx, dz) || 1;
  cam.yaw = Math.atan2(dx, dz);
  cam.pitch = Math.atan2(cy - ty, dh);
}

// ============================================================
// カメラのガタつき対策
//   原因は「毎フレーム先頭馬を選び直していた」こと。
//   1位と2位が競り合うと追尾対象が数フレームごとに入れ替わり、
//   注視点がワールド座標で数百単位ジャンプして画面がガタついてた。
//
//   1) 追尾馬はヒステリシス付きで選ぶ
//      FOCUS_MARGIN 以上離れて、それが FOCUS_HOLD フレーム続いた時だけ乗り換え
//   2) 乗り換え時は前の馬との間を補間（注視点を飛ばさない）
//   3) カメラワークの切り替えは「極座標で」クロスフェード
//      （被写体の周りを弧を描いて回るので、位置も向きも飛ばない）
//   4) 注視点の平滑化＋首振り速度の上限（急なワンフレーム反転を殺す）
//   5) 3Dカメラは毎フレーム瞬間移動させず減衰追従にする
// ============================================================
const FOCUS_MARGIN      = 28;    // この差を超えて先行されたら乗り換えを検討
const FOCUS_HOLD        = 12;    // 何フレーム連続で先行されたら乗り換えるか
const FOCUS_MIX_FRAMES  = 30;    // 乗り換え時の注視点の補間フレーム数
const SHOT_FRAMES       = 1200;  // 1つのカメラワークの長さ（3倍でゆっくり）
const SHOT_BLEND_FRAMES = 80;    // カメラワーク切り替えのクロスフェード
const LOOKBACK_MARGIN   = 150;   // 独走（見返しカメラ）判定の差
const LOOKBACK_HOLD     = 24;    // 独走判定を確定させる連続フレーム数
const AIM_SMOOTH        = 0.20;  // 注視点の平滑化
const MAX_YAW_STEP      = 0.075; // 1フレームの首振り上限（約4.3度）
const MAX_PITCH_STEP    = 0.05;  // 1フレームの上下上限

const camState = {
  focusId: -1, prevFocusId: -1, challenger: 0, mix: 1,
  shot: -1, blend: 1, fromPolar: null, curPolar: null,
  dokusou: 0,
  aimInit: false, aimX: 0, aimY: 24, aimZ: 0,
  yawInit: false, lastYaw: 0, lastPitch: 0,
  smooth3d: { x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0, init: false }
};
let camTargetFrame = -1, camTargetCache = null;

function resetCameraState() {
  camState.focusId = -1; camState.prevFocusId = -1; camState.challenger = 0;
  camState.mix = 1; camState.shot = -1; camState.blend = 1;
  camState.fromPolar = null; camState.curPolar = null; camState.dokusou = 0;
  camState.aimInit = false; camState.yawInit = false;
  camState.lastYaw = cam.yaw; camState.lastPitch = cam.pitch;
  camState.smooth3d.init = false;
  camTargetFrame = -1; camTargetCache = null;
}

function easeInOut(t) {
  t = clamp(t, 0, 1);
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// 追尾する馬を決める（首位争いの細かい入れ替わりは無視）
function pickFocusHorse(sorted) {
  const leader = sorted[0];
  if (camState.focusId > 0) {
    let cur = null;
    for (let i = 0; i < sorted.length; i++) {
      if (sorted[i].id === camState.focusId) { cur = sorted[i]; break; }
    }
    if (cur) {
      if (cur !== leader && (leader.d - cur.d) > FOCUS_MARGIN) {
        camState.challenger++;
        if (camState.challenger < FOCUS_HOLD) return cur;   // まだ乗り換えない
      } else {
        camState.challenger = 0;
        return cur;                                          // 現状維持
      }
    }
  }
  if (camState.focusId !== leader.id) {
    camState.prevFocusId = camState.focusId;
    camState.mix = 0;
  }
  camState.focusId = leader.id;
  camState.challenger = 0;
  return leader;
}

// 注視点（乗り換え中は前の馬との間を補間して狙いを飛ばさない）
function getFocusAimPoint(sorted) {
  const fh = pickFocusHorse(sorted);
  const p = getTrackPos(fh.d, fh.laneOffset);
  let ax = p.x, az = p.z;
  if (camState.mix < 1) {
    camState.mix = Math.min(1, camState.mix + 1 / FOCUS_MIX_FRAMES);
    if (camState.prevFocusId > 0) {
      let ph = null;
      for (let i = 0; i < sorted.length; i++) {
        if (sorted[i].id === camState.prevFocusId) { ph = sorted[i]; break; }
      }
      if (ph) {
        const pp = getTrackPos(ph.d, ph.laneOffset);
        const e = easeInOut(camState.mix);
        ax = lerp(pp.x, p.x, e);
        az = lerp(pp.z, p.z, e);
      }
    }
  }
  return { x: ax, y: 24, z: az, horse: fh, angle: p.angle };
}

// ---- カメラワーク定義（注視点からの相対オフセット） ----
//   f: 進行方向成分 / r: 走路の右方向成分 / y: 高さ
//   lf,lr,ly: 注視点の先読みオフセット
const SHOT_DEF = [
  { f: -180,  r: 1050, y: 265, lf: 100,  lr: 0, ly: 24 },  // 0: 外側ハイ
  { f: -1350, r: 270,  y: 205, lf: 300,  lr: 0, ly: 22 },  // 1: 真後ろ
  { f: 180,   r: 680,  y: 175, lf: -100, lr: 0, ly: 22 },  // 2: 外側ロー
  { f: 700,   r: 140,  y: 200, lf: -700, lr: 0, ly: 24 },  // 3: 見返し
  { f: 813,   r: -813, y: 205, lf: 0,    lr: 0, ly: 24 }   // 4: 序盤追走
];

function shotToPolar(i) {
  const d = SHOT_DEF[clamp(i, 0, SHOT_DEF.length - 1)];
  return {
    d: Math.hypot(d.f, d.r), th: Math.atan2(d.r, d.f), y: d.y,
    ld: Math.hypot(d.lf, d.lr), lth: Math.atan2(d.lr, d.lf), ly: d.ly
  };
}

function blendPolar(a, b, t) {
  return {
    d: lerp(a.d, b.d, t), th: lerpAngle(a.th, b.th, t), y: lerp(a.y, b.y, t),
    ld: lerp(a.ld, b.ld, t), lth: lerpAngle(a.lth, b.lth, t), ly: lerp(a.ly, b.ly, t)
  };
}

function polarToCam(p, aim, bob) {
  const a = aim.angle;
  const fX = -Math.sin(a), fZ = Math.cos(a);   // 進行方向
  const rX = Math.cos(a), rZ = Math.sin(a);    // 右方向
  const f = p.d * Math.cos(p.th), r = p.d * Math.sin(p.th);
  // 注視点の先読みは「進行方向」基準で足す（位置と一緒に回すと画面が回るので分離）
  const lf = p.ld * Math.cos(p.lth), lr = p.ld * Math.sin(p.lth);
  return {
    x: aim.x + fX * f + rX * r, y: p.y + bob, z: aim.z + fZ * f + rZ * r,
    tx: aim.x + fX * lf + rX * lr, ty: p.ly, tz: aim.z + fZ * lf + rZ * lr
  };
}

// ショット（カメラワーク）を決める
function updateShotState(sorted, lead, elapsed) {
  if (sorted.length > 1 && (lead.d - sorted[1].d) > LOOKBACK_MARGIN) {
    camState.dokusou = Math.min(camState.dokusou + 1, LOOKBACK_HOLD);
  } else {
    camState.dokusou = Math.max(camState.dokusou - 1, 0);
  }
  let want;
  if (elapsed >= 240 && elapsed < 540) {
    want = 4;                                   // 序盤追走カメラ
  } else {
    const mode = isFinished ? 0 : Math.floor(frameCount / SHOT_FRAMES) % 3;
    want = mode;
    if (mode === 2 && !isFinished && camState.dokusou >= LOOKBACK_HOLD) want = 3;
  }
  const wantPolar = shotToPolar(want);
  if (camState.shot !== want) {
    camState.fromPolar = camState.curPolar ? camState.curPolar : wantPolar;
    camState.shot = want;
    camState.blend = 0;
  }
  if (camState.blend < 1) camState.blend = Math.min(1, camState.blend + 1 / SHOT_BLEND_FRAMES);
  const e = easeInOut(camState.blend);
  const pol = camState.blend < 1 ? blendPolar(camState.fromPolar, wantPolar, e) : wantPolar;
  camState.curPolar = pol;
  return pol;
}

// レース中のカメラ目標（2D/3D共用・1フレーム1回だけ計算）
function getRaceCamTarget() {
  if (camTargetFrame === frameCount && camTargetCache) return camTargetCache;
  const sorted = sortHorses();
  if (!sorted.length) return null;
  const aim = getFocusAimPoint(sorted);
  const elapsed = frameCount - raceStartTime;
  const pol = updateShotState(sorted, sorted[0], elapsed);
  const bob = Math.sin(aim.horse.legAngle * 2) * 2.2;
  const t = polarToCam(pol, aim, bob);
  t.aim = aim;
  t.sorted = sorted;
  camTargetFrame = frameCount;
  camTargetCache = t;
  return t;
}

// カメラを目標位置へ寄せ、その「今いる位置」から目標点をきっちり見る。
// 注視点は平滑化し、首振りは1フレームあたりの上限を設けて急な反転を殺す。
function lerpCamTo(tx, ty, tz, lx, ly, lz, k) {
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
  cam.z = lerp(cam.z, tz, k);
  aimAt(lx, ly, lz);
}

function aimAt(lx, ly, lz) {
  if (!camState.aimInit) {
    camState.aimX = lx; camState.aimY = ly; camState.aimZ = lz; camState.aimInit = true;
  } else {
    camState.aimX = lerp(camState.aimX, lx, AIM_SMOOTH);
    camState.aimY = lerp(camState.aimY, ly, AIM_SMOOTH);
    camState.aimZ = lerp(camState.aimZ, lz, AIM_SMOOTH);
  }
  const dx = camState.aimX - cam.x, dz = camState.aimZ - cam.z;
  const dh = Math.hypot(dx, dz) || 1;

  if (!camState.yawInit) {
    camState.yawInit = true;
    camState.lastYaw = cam.yaw;
    camState.lastPitch = cam.pitch;
  }

  // 目標の向き
  const wantYaw = Math.atan2(dx, dz);
  let dyaw = wantYaw - camState.lastYaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;
  dyaw = clamp(dyaw, -MAX_YAW_STEP, MAX_YAW_STEP);
  camState.lastYaw += dyaw;
  cam.yaw = camState.lastYaw;

  const wantPitch = Math.atan2(cam.y - camState.aimY, dh);
  let dpitch = wantPitch - camState.lastPitch;
  dpitch = clamp(dpitch, -MAX_PITCH_STEP, MAX_PITCH_STEP);
  camState.lastPitch += dpitch;
  cam.pitch = camState.lastPitch;
}

function updateCamera() {
  const sorted = sortHorses();
  if (sorted.length === 0) return;
  const leadHorse = sorted[0];
  const elapsed = frameCount - raceStartTime;

  // ---- パドック（発走前）：ゲートを斜め前から見る ----
  if (!isRacing && !isFinished) {
    const g0 = getTrackPos(0, 0);
    lerpCamTo(g0.x + 230, 165, g0.z - 620, g0.x, 26, g0.z + 40, 0.06);
    return;
  }

  // ---- リプレイ：進行方向の斜め外側から追いかける ----
  if (isReplaying) {
    const t0 = (top3Horses && top3Horses[0]) ? top3Horses[0] : leadHorse;
    const tp = getTrackPos(t0.d, t0.laneOffset);
    const dir = travelDir(t0.d);
    const perpX = dir.z, perpZ = -dir.x;      // 走路の外側
    lerpCamTo(
      tp.x + dir.x * 250 + perpX * 330, 172,
      tp.z + dir.z * 250 + perpZ * 330,
      tp.x, 26, tp.z, 0.17
    );
    return;
  }

  // ---- ウイニングラン：勝ち馬を外側から並走して追う ----
  if (isPodium) {
    const w = winner || leadHorse;
    const wp = getTrackPos(w.d, w.laneOffset);
    const dir = travelDir(w.d);
    const perpX = dir.z, perpZ = -dir.x;
    lerpCamTo(
      wp.x + perpX * 400 - dir.x * 110, 152,
      wp.z + perpZ * 400 - dir.z * 110,
      wp.x, 30, wp.z, 0.05
    );
    return;
  }

  // ---- 結果表示中：カメラを止める ----
  if (isResultFlash) return;

  // ---- 序盤：ゲート前から回り込む ----
  if (elapsed < 240) {
    const p = clamp(elapsed / 240, 0, 1);
    const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const radius = lerp(820, 1000, ease);
    const ang = lerp(Math.atan2(-200, 1200), Math.PI * 0.75, ease);
    lerpCamTo(
      Math.cos(ang) * radius, lerp(230, 205, ease), Math.sin(ang) * radius,
      0, 24, lerp(120, 0, ease), 0.09
    );
    return;
  }

  const t = getRaceCamTarget();
  if (!t) return;
  const aim = t.aim;

  // ---- ゴール前：先頭を追尾するフィニッシュカメラ ----
  if (leadHorse.d > totalDistance - 1100) {
    const fp = getTrackPos(totalDistance, 0);
    const followZ = clamp(aim.z, fp.z - 1000, fp.z + 900);
    lerpCamTo(
      fp.x - 640, 178, followZ - 330,
      aim.x, 26, aim.z - 40, 0.14
    );
    return;
  }

  // ---- 通常のカメラワーク（極座標クロスフェード込み） ----
  lerpCamTo(t.x, t.y, t.z, t.tx, t.ty, t.tz, 0.06);
}

function updateHUD() {
  el('money').textContent = '所持金: ' + fmt(myMoney) + ' G';

  if (isRegistering || isBreeding) {
    el('timer').textContent = '';
    el('raceinfo').textContent = '';
    el('hstats').textContent = '';
    return;
  }

  if (!isRacing && !isFinished) {
    el('timer').textContent = 'パドック中 — 出馬表を確認してスタートしてください';
    el('timer').style.color = '#ffb74d';
  } else if (isRacing && !isFinished) {
    el('timer').textContent = 'レース中';
    el('timer').style.color = '#4dd0e1';
  } else if (isFinished) {
    el('timer').textContent = 'レース終了';
    el('timer').style.color = '#ffd23f';
  }

  const ri = getRaceInfo();
  el('raceinfo').textContent = ri.name + ' [' + ri.grade + '] ／ 1着 ' + fmt(ri.prize) + ' G' +
    (isPlayerEntered ? ' ／ 出走中' : '');

  // 自分の馬の情報は「今このレースに出走してる時」だけ出す
  const myInRace = isPlayerEntered && myHorseData;
  if (myInRace) {
    const h = myHorseData;
    el('hstats').innerHTML =
      '<b style="color:#ffd23f">' + h.name + '</b> ' + h.runType +
      ' ｜ 調子 <span class="' + COND_CLS[condIdx(h.condition)] + '">' + h.condition + '</span><br>' +
      'SP ' + h.baseSpeed.toFixed(2) + ' ／ 瞬発 ' + h.spurtPower.toFixed(2) +
      ' ／ ST ' + h.guts.toFixed(2) + ' ｜ 育成 ' + h.trainingCount + '/30<br>' +
      '通算 ' + (h.wins || 0) + '勝 ／ 獲得賞金 ' + fmt(h.prizeMoney || 0) + ' G';
  } else {
    el('hstats').textContent = '';
  }
}

function startRaceNow() {
  if (isRacing || isFinished) return;
  if (!horses || horses.length === 0) return;
  isRacing = true;
  isFinished = false;
  isTrainingMode = false;
  hasTrained = false;
  raceStartTime = frameCount;
  syncPanels();            // レース中は出馬表を隠す
  commentaryLog = ['各馬ゲートイン完了。ゲートが開きました！レーススタート！'];
  const cm = el('comment');
  if (cm) cm.innerHTML = commentaryLog.join('<br>');
  updatePanel();
  updateHUD();
}

let panelsHidden = false;   // 育成・登録画面などでUIを畳んでるか

// 画面の出し分けを一元化
//  育成/登録/繁殖 … 全部隠す
//  パドック       … 左=出馬表 / 右=馬券（＋フル画面オーバーレイ）
//  レース中/終了  … 出馬表は隠す / 馬券パネルだけ残す
function syncPanels() {
  const card = el('cardPanel');
  const bet  = el('betPanel');
  const off = panelsHidden || isRegistering || isBreeding;

  // パドック中（発走前）は左パネルを必ず出す
  const cardHidden = off || isRacing || isFinished;
  if (card) card.classList.toggle('hide', cardHidden);

  // 右の馬券パネルはレース中だけ隠す
  if (bet)  bet.classList.toggle('hide', off || isRacing);

  const b = document.body;
  if (b && b.classList) b.classList.toggle('racing', !!isRacing && !off);
}

// 旧 hidePanels は互換のため残す
function hidePanels(v) {
  panelsHidden = !!v;
  syncPanels();
}

function updatePanel() {
  const cardBody = el('cardBody');
  const betBody = el('betBody');
  if (!cardBody || !betBody) return;
  if (isRegistering || isBreeding) { cardBody.innerHTML = ''; betBody.innerHTML = ''; return; }
  cardBody.innerHTML = buildCardHTML();
  betBody.innerHTML = buildBetHTML();
  bindPanel();
  syncPanels();
}

function buildCardHTML() {
  const ri = getRaceInfo();
  const WAKU_BG  = ['#f5f5f5', '#212121', '#e53935', '#1e88e5', '#fdd835', '#43a047', '#fb8c00', '#ec407a'];
  const WAKU_FG  = ['#111111', '#ffffff', '#ffffff', '#ffffff', '#3e2723', '#ffffff', '#ffffff', '#ffffff'];

  const popRanks = horses.slice().sort(function (a, b) {
    return a.popularity - b.popularity;
  });
  const rankMarks = {};
  popRanks.forEach(function(h, i) {
    if (i === 0) rankMarks[h.id] = '◎';
    else if (i === 1) rankMarks[h.id] = '○';
    else if (i === 2) rankMarks[h.id] = '▲';
  });

  const sorted = horses.slice().sort(function (a, b) { return a.id - b.id; });

  let html = '';
  html += '<div class="np-head"><b>LET\'S HORSES 競馬新聞</b>' +
    '<span>' + ri.name + ' [' + ri.grade + ']</span></div>';
  html += '<div class="np-sub">1着賞金 ' + fmt(ri.prize) + 'G ／ 出走料 ' + fmt(ri.fee) +
    'G ／ ' + packState + '・' + racePace + ' ／ ' +
    (isRacing ? 'レース中' : (isFinished ? '確定' : '発走前')) + '</div>';

  html += '<div class="np-table">';
  // グリッド：枠(22px) 印(28px) 馬名(2fr=広め) 脚質(44px) 調子(40px) 人気(36px) オッズ(50px) 所持スキル(1fr)
  html += '<div class="np-row np-hd" style="grid-template-columns:20px 20px 26px minmax(170px,3fr) 44px 40px 36px 50px minmax(90px,1fr);">' +
    '<span style="text-align:center">枠</span><span style="text-align:center">馬番</span>' +
    '<span style="text-align:center">印</span>' +
    '<span>馬名</span><span style="text-align:center">脚質</span>' +
    '<span style="text-align:center">調子</span><span style="text-align:center">人気</span>' +
    '<span style="text-align:right">オッズ</span>' +
    '<span style="text-align:center">所持スキル</span></div>';

  for (const h of sorted) {
    const wk = Math.min(8, Math.ceil(h.id / 2));
    const rtIdx = RUN_TYPES.indexOf(h.runType);
    const mine = h.isMyHorse ? ' mine' : '';
    const skillText = (h.skills && h.skills.length)
      ? h.skills.map(function(s) { return s.name; }).join('、')
      : '-';
    html += '<div class="np-row' + mine + '" style="grid-template-columns:20px 20px 26px minmax(170px,3fr) 44px 40px 36px 50px minmax(90px,1fr);">' +
      '<span class="np-w" style="background:' + WAKU_BG[wk - 1] + ';color:' + WAKU_FG[wk - 1] + '">' +
        wk + '</span>' +
      '<span class="np-num">' + h.id + '</span>' +
      '<span class="np-rank" style="color:#e53935;font-weight:bold;text-align:center">' + (rankMarks[h.id] || '') + '</span>' +
      '<span class="np-name">' + h.name + (h.isMyHorse ? ' ★' : '') +
        (h.isMonster ? ' <em style="color:#ef5350">怪物</em>' : '') +
        (h.isMatch ? ' <em style="color:#ff8a65">一騎</em>' : '') +
      '</span>' +
      '<span class="np-rt" style="text-align:center">' +
        (h.runType === '大逃げ' ? '大逃' : h.runType) + '</span>' +
      '<span class="np-cond ' + COND_CLS[condIdx(h.condition)] + '" style="text-align:center">' + h.condition + '</span>' +
      '<span class="np-pop" style="text-align:center">' + h.popularity + '</span>' +
      '<span class="np-odds" style="text-align:right">' + h.oddsStr + '</span>' +
      '<span style="text-align:center;font-size:10px;color:#b0bec5;">' + skillText + '</span>' +
      '</div>';
  }
  html += '</div>';

  if (!isRacing && !isFinished) {
    html += '<div class="np-foot">「出馬表決定してスタート」で発走やで</div>';
  }
  return html;
}


function buyShare(id, amount) {
  if (isRacing || isFinished) return;
  const h = horses.find(function (x) { return x.id === id; });
  if (!h) return;
  const ri = getRaceInfo();
  const cost = Math.floor((ri.prize * 0.6) / h.odds) * amount;
  if (myMoney < cost) { toast('メダルが足りません！'); return; }
  myMoney -= cost;
  ownedShares[id] = (ownedShares[id] || 0) + amount;
  updateHUD();
  updatePanel();
}

function buildBetHTML() {
  const raceDone = isRacing || isFinished;
  const need = BET_NEED[betType];
  const isFormation = need >= 2;
  const picks = getBetPicks();
  if (isFormation) {
    if (picks.length !== need) betPicksByType[betType] = new Array(need).fill(0);   // 未選択は 0 で枠を固定
  } else {
    betPicksByType[betType] = picks.filter(function (x) { return x > 0; }).slice(0, need);
  }
  let html = '';

  // ---- レース中／終了後：馬選択のUIは畳んで、状況と購入済みだけ出す ----
  if (raceDone) {
    html += '<div class="raceState">' +
      (isFinished ? 'レース終了 — 結果を確認してな' : 'レース中 — 馬券の受付は終了やで') +
      '</div>';
    html += '<div class="tickets"><div class="betlabel">購入済み（' + tickets.length + '件）</div>';
    if (tickets.length === 0) {
      html += '<div class="empty">今回は買うてへんかったな</div>';
    } else {
      tickets.forEach(function (t) {
        html += '<div class="ticket"><span>' + t.type + ' <span class="tk">' +
          t.picks.join('-') + '</span> ' + t.odds.toFixed(1) + '倍</span>' +
          '<span>' + fmt(t.stake) + ' G</span></div>';
      });
      const totalStake0 = tickets.reduce(function (a, t) { return a + t.stake; }, 0);
      html += '<div style="text-align:right;font-size:11px;color:#8fa4b3;margin-top:5px">' +
        '合計 ' + fmt(totalStake0) + ' G</div>';
    }
    html += '</div>';
    return html;
  }

  // パドック中はここからも発走できる
  if (!raceDone && horses.length > 0) {
    html += '<div class="raceStartRow">' +
      '<button class="raceStart" data-start="1">出馬表決定してスタート</button>' +
      '</div>';
  }

  // 券種選択
  html += '<div class="betsec"><div class="betlabel">券種</div><div class="bettypes" id="betTypes">';
  for (const t of BET_TYPES) {
    html += '<div data-bt="' + t + '" class="' + (t === betType ? 'on' : '') + '">' + t + '</div>';
  }
  html += '</div></div>';

  // 馬選択: 番号順（1番〜12番）
  const sortedByNum = horses.slice().sort(function (a, b) { return a.id - b.id; });

  if (!isFormation) {
    // 単勝・複勝: 従来通り1頭選択
    const isFuku = betType === '複勝';
    html += '<div class="betsec"><div class="betlabel">馬を選ぶ（1頭）｜下段は' + (isFuku ? '複勝' : '新聞と同じ単勝') + 'オッズ</div><div class="horsegrid" id="horseGrid">';
    for (const h of sortedByNum) {
      const on = getBetPicks().indexOf(h.id) >= 0 ? ' on' : '';
      const me = h.isMyHorse ? ' me' : '';
      let dispOdds = h.oddsStr;
      if (isFuku) {
        const fo = calcOdds('複勝', [h.id]);
        dispOdds = fo < 10 ? fo.toFixed(1) : String(Math.round(fo));
      }
      html += '<div data-hid="' + h.id + '" class="' + on + me + '">' +
        '<span class="hn">' + h.id + '</span>' +
        '<span class="ho">' + dispOdds + '</span></div>';
    }
    html += '</div></div>';
  } else {
    // 馬連以降: フォーメーション式
    const LABELS = {
      '馬連':   ['1頭目（軸）', '2頭目（相手）'],
      'ワイド': ['1頭目（軸）', '2頭目（相手）'],
      '馬単':   ['1着', '2着'],
      '3連複':  ['1頭目（軸）', '2頭目（相手）', '3頭目（相手）'],
      '3連単':  ['1着', '2着', '3着']
    };
    const labels = LABELS[betType] || ['1頭目', '2頭目', '3頭目'];
    const picked = getBetPicks();

    for (let pos = 0; pos < need; pos++) {
      html += '<div class="form-label">' + labels[pos] + 'を選ぶ</div>';
      html += '<div class="form-box" data-formpos="' + pos + '">';
      for (const h of sortedByNum) {
        const alreadyPickedAtOther = picked.indexOf(h.id) >= 0 && picked.indexOf(h.id) !== pos;
        const on = picked[pos] === h.id ? ' on' : '';
        const me = h.isMyHorse ? ' me' : '';
        const dim = alreadyPickedAtOther ? ' dim' : '';
        html += '<div data-fhid="' + h.id + '" data-fpos="' + pos + '" class="' + on + me + dim + '">' + h.id + '</div>';
      }
      html += '</div>';
    }

    // 選択サマリー
    html += '<div class="form-summary">選択: ' +
      picked.map(function(pid, i) { return '<b>' + (i+1) + '.</b> ' + (pid ? '#' + pid : '未選択'); }).join(' ') +
      '</div>';
  }

  // オッズ表示
  const curPicks = getBetPicks();
  if (curPicks.length === need && curPicks.every(function(x) { return x > 0; })) {
    const od = calcOdds(betType, curPicks.slice());
    const pay = Math.floor(betStake * od);
    html += '<div class="oddbox"><span>' + betType + ' ' + curPicks.join('-') + '</span>' +
      '<b>' + od.toFixed(1) + ' 倍</b></div>';
    html += '<div style="text-align:right;font-size:11px;color:#8fa4b3;margin-top:4px">' +
      betStake + ' G → ' + fmt(pay) + ' G</div>';
  } else {
    const remain = isFormation
      ? curPicks.filter(function(x) { return !x; }).length
      : need - curPicks.length;
    html += '<div class="oddbox"><span>残り ' + remain +
      ' 頭選んでな</span><b>—</b></div>';
  }

  // 金額
  html += '<div class="betsec" style="margin-top:10px"><div class="betlabel">金額</div>' +
    '<div class="stakes" id="stakes">';
  for (const s of STAKES) {
    html += '<div data-st="' + s + '" class="' + (s === betStake ? 'on' : '') + '">' + fmt(s) + '</div>';
  }
  html += '</div></div>';

  const canBuy = !raceDone && curPicks.length === need &&
    curPicks.every(function(x) { return x > 0; }) && myMoney >= betStake;
  html += '<button class="betbtn" id="btnBet"' +
    (canBuy ? '' : ' disabled') +
    '>馬券を買う</button>';

  // 購入済み
  html += '<div class="tickets"><div class="betlabel">購入済み（' + tickets.length + '件）</div>';
  if (tickets.length === 0) {
    html += '<div class="empty">まだ買ってへんで</div>';
  } else {
    tickets.forEach(function (t, i) {
      html += '<div class="ticket"><span>' + t.type + ' <span class="tk">' +
        t.picks.join('-') + '</span> ' + t.odds.toFixed(1) + '倍</span>' +
        '<span>' + fmt(t.stake) + ' G' +
        (raceDone ? '' : ' <button data-del="' + i + '" style="background:#ef5350;' +
          'padding:2px 6px;font-size:10px;margin-left:6px;border-radius:4px">取消</button>') +
        '</span></div>';
    });
    const totalStake = tickets.reduce(function (a, t) { return a + t.stake; }, 0);
    html += '<div style="text-align:right;font-size:11px;color:#8fa4b3;margin-top:5px">' +
      '合計 ' + fmt(totalStake) + ' G</div>';
  }
  html += '</div>';

  return html;
}

function bindPanel() {
  // 馬券パネル側のスタート
  const startRow = document.querySelector('.raceStartRow');
  if (startRow) {
    startRow.addEventListener('click', function (e) {
      const st = e.target.closest('[data-start]');
      if (st) { startRaceNow(); return; }
    });
  }

  // 券種切り替え
  const bt = el('betTypes');
  if (bt) {
    bt.addEventListener('click', function (e) {
      const t = e.target.closest('[data-bt]');
      if (!t) return;
      betType = t.getAttribute('data-bt');
      updatePanel();
    });
  }

  // 単勝・複勝用: 1頭選択
  const hg = el('horseGrid');
  if (hg) {
    hg.addEventListener('click', function (e) {
      const t = e.target.closest('[data-hid]');
      if (!t) return;
      togglePick(parseInt(t.getAttribute('data-hid'), 10));
    });
  }

  // フォーメーション用: 軸馬・相手馬を分けて選択（別枠の馬を押したら入れ替え）
  const formBoxes = document.querySelectorAll('[data-formpos]');
  formBoxes.forEach(function (box) {
    box.addEventListener('click', function (e) {
      const t = e.target.closest('[data-fhid]');
      if (!t) return;
      const pos = parseInt(t.getAttribute('data-fpos'), 10);
      const hid = parseInt(t.getAttribute('data-fhid'), 10);
      const need = BET_NEED[betType];
      const fpicks = getBetPicks();
      while (fpicks.length < need) fpicks.push(0);   // 未選択は 0 で埋める
      const cur = fpicks.indexOf(hid);
      if (cur === pos) {
        fpicks[pos] = 0;                                // 同じ枠を再タップ → 解除
      } else if (cur >= 0) {
        fpicks[cur] = fpicks[pos];                    // 別枠にいた → 入れ替え
        fpicks[pos] = hid;
      } else {
        fpicks[pos] = hid;
      }
      betPicksByType[betType] = fpicks;
      updatePanel();
    });
  });

  // 金額選択
  const st = el('stakes');
  if (st) {
    st.addEventListener('click', function (e) {
      const t = e.target.closest('[data-st]');
      if (!t) return;
      betStake = parseInt(t.getAttribute('data-st'), 10);
      updatePanel();
    });
  }

  // 馬券購入ボタン
  const bb = el('btnBet');
  if (bb) bb.addEventListener('click', buyTicket);

  // 購入済み馬券の取消・一口馬主購入
  const cardBody = el('cardBody');
  const betBody = el('betBody');
  [cardBody, betBody].forEach(function(body) {
    if (!body) return;
    body.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        removeTicket(parseInt(b.getAttribute('data-del'), 10));
      });
    });
    body.querySelectorAll('[data-buy]').forEach(function (b) {
      b.addEventListener('click', function () {
        buyShare(parseInt(b.getAttribute('data-buy'), 10),
                 parseInt(b.getAttribute('data-n'), 10));
      });
    });
  });
}

function toast(msg) {
  const c = el('comment');
  const old = c.innerHTML;
  c.innerHTML = '⚠ ' + msg;
  setTimeout(function () { c.innerHTML = old; }, 1800);
}

    const c = initialCandidates[i];
    html += '<div class="cand' + (i === 0 ? ' on' : '') + '" data-ci="' + i + '">' +
      '<div class="t">タイプ: ' + c.runType + '</div>' +

      '</div>';
  }
  html += '</div>';

  html += '<div class="fld"><label>あなたの馬の名前（カタカナ 2〜9文字）</label>' +
    '<input id="inpName" maxlength="9" placeholder="例: サイレンスラン" autocomplete="off">' +
    '<div class="hint">カタカナだけやで。ひらがな・漢字はあかん。</div>' +
    '<div class="err" id="nameErr"></div></div>';

  html += '<div class="row"><button class="b-orange" id="btnStart" style="width:100%">' +
    '決定して開始</button></div>';

  showModal(html);

  const cands = el('cands');
  cands.addEventListener('click', function (e) {
    const t = e.target.closest('[data-ci]');
    if (!t) return;
    selectedCand = parseInt(t.getAttribute('data-ci'), 10);
    cands.querySelectorAll('.cand').forEach(function (c, i) {
      c.classList.toggle('on', i === selectedCand);
    });
  });

  const inp = el('inpName');
  inp.focus();
  inp.addEventListener('input', function () { el('nameErr').textContent = ''; });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el('btnStart').click();
  });

  el('btnStart').addEventListener('click', confirmRegister);
}

function confirmRegister() {
  const nm = (el('inpName').value || '').trim();
  if (!/^[\u30A0-\u30FF\u30FC]{2,9}$/.test(nm)) {
    el('nameErr').textContent = 'カタカナ2〜9文字で入力してな。';
    return;
  }

  // 隠しコマンド（元仕様の「もみがら」）
  if (nm === 'モミガラ') {
    myMoney = 99999;
    const sk = makeSkill('大逃げ');
    myHorseData = {
      name: 'サイレンススズカ', baseSpeed: 19.9, spurtPower: 1.8, guts: 19.9,
      runType: '大逃げ', coat: '#4e342e', silk: '#43a047',
      trainingCount: 0, peak: 30, wins: 0, condition: '絶好調',
      prizeMoney: 0, skills: [sk]
    };
    isRegistering = false;
    hideModal();
    currentRaceIndex = 0;
    registeredRaces = [];
    isPlayerEntered = false;
    updateHUD();
    resetRace();
    toast('デバッグモード起動や');
    return;
  }

  const c = initialCandidates[selectedCand];
  myHorseData = {
    name: nm,
    baseSpeed: c.baseSpeed,
    spurtPower: c.spurtPower,
    guts: c.guts,
    runType: c.runType,
    coat: c.coat,
    silk: c.silk,
    trainingCount: 0,
    peak: c.peak,
    wins: 0,
    condition: '普通',
    prizeMoney: 0,
    skills: [makeSkill(c.runType)]
  };
  isRegistering = false;
  currentRaceIndex = 0;
  registeredRaces = [];
  isPlayerEntered = false;
  hideModal();
  updateHUD();
  resetRace();
}

function showBreedingScreen() {
  isBreeding = true;
  isTrainingMode = false;
  hideModal();

  const mates = [
    { name: '手頃な馬', price: 0, mult: 1.0 },
    { name: '良血馬', price: 1000, mult: 1.05 },
    { name: '伝説の馬', price: 3000, mult: 1.15 }
  ];
  initialCandidates = mates.map(function (m) {
    const c = generateCandidate(m.mult);
    c.mateName = m.name;
    c.price = m.price;
    return c;
  });
  selectedCand = 0;

  let html = '<h1 class="pink">引退・次世代への配合</h1>' +
    '<div class="tag">' + (myHorseData ? myHorseData.name : '') +
    ' は引退しました。賞金で新たな馬を配合しよう。</div>';

  html += '<div class="cands" id="mates">';
  for (let i = 0; i < 3; i++) {
    const c = initialCandidates[i];
    html += '<div class="cand' + (i === 0 ? ' on' : '') + '" data-mi="' + i + '">' +
      '<div class="t" style="color:#f06292">' + c.mateName + '</div>' +
      '<div class="price">費用: ' + fmt(c.price) + ' G</div>' +
      '<div class="s" style="margin-top:5px"><span>タイプ</span><b style="color:#fff">' + c.runType + '</b></div>' +
      '<div class="s"><span>潜在SP</span><b>' + (c.baseSpeed * 10).toFixed(0) + '</b></div>' +
      '<div class="s"><span>潜在ST</span><b>' + (c.guts * 10).toFixed(0) + '</b></div>' +
      '<div class="s"><span>瞬発</span><b>' + c.spurtPower.toFixed(2) + '</b></div>' +
      '</div>';
  }
  html += '</div>';

  html += '<div class="fld"><label>新しい馬の名前（カタカナ 2〜9文字）</label>' +
    '<input id="inpBreed" maxlength="9" placeholder="例: トウカイテイオー" autocomplete="off">' +
    '<div class="err" id="breedErr"></div></div>';

  html += '<div class="row">' +
    '<button class="b-purple" id="btnBreed" style="flex:1;padding:12px">配合して世代交代</button>' +
    '<button class="b-gray" id="btnBreedCancel">やめる</button>' +
    '</div>';

  showModal(html);

  const matesEl = el('mates');
  matesEl.addEventListener('click', function (e) {
    const t = e.target.closest('[data-mi]');
    if (!t) return;
    selectedCand = parseInt(t.getAttribute('data-mi'), 10);
    matesEl.querySelectorAll('.cand').forEach(function (c, i) {
      c.classList.toggle('on', i === selectedCand);
    });
  });

  el('btnBreedCancel').addEventListener('click', function () {
    isBreeding = false;
    hideModal();
    updatePanel();
  });

  el('btnBreed').addEventListener('click', function () {
    const c = initialCandidates[selectedCand];
    if (myMoney < c.price) { el('breedErr').textContent = '賞金が足りません！'; return; }
    const nm = (el('inpBreed').value || '').trim();
    if (!/^[\u30A0-\u30FF\u30FC]{2,9}$/.test(nm)) {
      el('breedErr').textContent = 'カタカナ2〜9文字で入力してな。';
      return;
    }
    myMoney -= c.price;
    myHorseData = {
      name: nm, baseSpeed: c.baseSpeed, spurtPower: c.spurtPower, guts: c.guts,
      runType: c.runType, coat: c.coat, silk: c.silk,
      trainingCount: 0, peak: c.peak, wins: 0, condition: '普通',
      prizeMoney: 0, skills: [makeSkill(c.runType)]
    };
    isBreeding = false;
    hideModal();
    currentRaceIndex = 0;
    registeredRaces = [];
    isPlayerEntered = false;
    updateHUD();
    resetRace();
  });
}

function toggleTrainingScreen() {
  if (isRacing || isFinished || isRegistering || isBreeding) {
    if (isRacing) toast('レース中です');
    return;
  }
  if (!myHorseData) { showRegisterScreen(); return; }
  isTrainingMode = !isTrainingMode;
  if (isTrainingMode) {
    updateTrainingScreen();
    hidePanels(true);
  } else {
    hideModal();
    hidePanels(false);
    updatePanel();
  }
}

function updateTrainingScreen() {
  if (!myHorseData) return;
  const h = myHorseData;
  const isPastPeak = h.trainingCount > h.peak;
  const peakText = isPastPeak
    ? '<span style="color:#ef5350">ピークを過ぎたようだ…</span>'
    : '<span style="color:#66bb6a">まだまだ成長期だ！</span>';

  const trainDisabled = (hasTrained || isPlayerEntered) ? 'disabled' : '';
  const condDisabled = isPlayerEntered ? 'disabled' : '';

  let html = '<h1>あなたの馬を育成・設定</h1>';
  html += '<div class="tag">' + (isPlayerEntered
    ? '<span style="color:#ff5252;font-weight:bold">今週はレース出走週です！トレーニングはできません。</span>'
    : 'パドックの間に上げられる能力は1つ、1回のみです') + '</div>';

  html += '<div class="stats">' +
    '<div class="sbox"><div class="k">スピード</div><div class="v">' + h.baseSpeed.toFixed(2) + '</div>' +
      '<div class="bar"><i style="width:' + clamp(h.baseSpeed / 20 * 100, 0, 100) + '%"></i></div></div>' +
    '<div class="sbox"><div class="k">スパート</div><div class="v">' + h.spurtPower.toFixed(2) + '</div>' +
      '<div class="bar"><i style="width:' + clamp(h.spurtPower / 3 * 100, 0, 100) + '%"></i></div></div>' +
    '<div class="sbox"><div class="k">スタミナ</div><div class="v">' + h.guts.toFixed(2) + '</div>' +
      '<div class="bar"><i style="width:' + clamp(h.guts / 20 * 100, 0, 100) + '%"></i></div></div>' +
    '<div class="sbox"><div class="k">調子</div><div class="v" style="font-size:15px;color:' +
      ['#78909c','#4fc3f7','#e0e0e0','#ffb74d','#ff5252'][condIdx(h.condition)] + '">' +
      h.condition + '</div></div>' +
    '</div>';

  html += '<div style="display:flex;justify-content:space-between;font-size:12px;' +
    'color:#8fa4b3;margin-bottom:12px;padding:0 2px">' +
    '<span>' + h.name + ' ／ ' + h.runType + '</span>' +
    '<span>育成 ' + h.trainingCount + '/30 ／ ピーク ' + h.peak + '回</span></div>';
  html += '<div style="text-align:center;font-size:12.5px;margin-bottom:12px">' + peakText +
    ' ／ スキル <b style="color:#4dd0e1">' +
    (h.skills && h.skills[0] ? h.skills[0].name : 'なし') + '</b></div>';

  if (hasTrained && !isPlayerEntered) {
    const col = lastTrainingResult === '超大成功' ? '#ffeb3b'
              : lastTrainingResult === '大成功' ? '#ff9800' : '#66bb6a';
    html += '<div style="text-align:center;color:' + col + ';font-weight:bold;' +
      'margin-bottom:10px">育成' + lastTrainingResult + '！</div>';
  }

  html += '<div class="tlist">';
  html += '<div class="titem"><div><div class="a">スピード強化</div>' +
    '<div class="b">SP +0.2（10%で超大成功）／ 100 G</div></div>' +
    '<button class="b-green" data-tr="speed" ' + trainDisabled + '>強化</button></div>';
  html += '<div class="titem"><div><div class="a">スパート強化</div>' +
    '<div class="b">瞬発 +0.2（10%で超大成功）／ 100 G</div></div>' +
    '<button class="b-red" data-tr="spurt" ' + trainDisabled + '>強化</button></div>';
  html += '<div class="titem"><div><div class="a">スタミナ強化</div>' +
    '<div class="b">ST +0.2（10%で超大成功）／ 100 G</div></div>' +
    '<button class="b-blue" data-tr="guts" ' + trainDisabled + '>強化</button></div>';
  html += '<div class="titem"><div><div class="a">やる気向上</div>' +
    '<div class="b">調子を1段階上げる ／ 50 G</div></div>' +
    '<button class="b-purple" data-tr="cond" ' + condDisabled + '>強化</button></div>';
  html += '<div class="titem"><div><div class="a">引退・配合</div>' +
    '<div class="b">次世代の馬を誕生させる</div></div>' +
    '<button class="b-gray" data-tr="breed">配合</button></div>';
  html += '</div>';

  // 脚質変更

      'border:1.5px solid ' + (r === h.runType ? '#ffd23f' : 'transparent') + ';' +
      'color:' + (r === h.runType ? '#ffd23f' : '#b0bec5') + '">' + r + '</div>';
  }
  html += '</div></div>';

  // 出走登録
  html += '<div style="margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px">';

  for (let i = 1; i <= 3; i++) {

    const rInfo = RACE_CALENDAR[rIdx];

    let fee, label, canEnter = true, reason = '';

    if (h.wins === 0) {
      fee = 100;
      label = isReg ? '登録済' : i + '週: 未勝利戦 [未勝利] (100G)';
    } else {
      fee = rInfo.fee;
      if (rInfo.grade === '新馬戦' || rInfo.grade === '未勝利戦') {
        canEnter = false;
        reason = '(勝利馬不可)';
      }
      label = isReg ? '登録済' : i + '週: ' + rInfo.name + ' [' + rInfo.grade + '] (' + fee + 'G)';
    }

    const dis = (isReg || !canEnter) ? 'disabled' : '';
    const bg = isReg ? 'rgba(100,100,100,.55)'
              : (canEnter ? 'linear-gradient(135deg,#00acc1,#00838f)' : 'rgba(80,80,80,.5)');

      ' style="width:100%;text-align:left;margin-bottom:5px;padding:8px 11px;' +
      'font-size:11.5px;border-radius:7px;background:' + bg + ';color:#fff;' +
      'font-weight:bold;' + (dis ? 'cursor:not-allowed;opacity:.6' : '') + '">' +
      label + '<span style="float:right;font-size:10px;color:#ffeb3b">' + reason + '</span></button>';

    'style="padding:10px 30px;font-size:14px">閉じる</button></div>';

  // バインド
  el('mInner').querySelectorAll('[data-tr]').forEach(function (b) {
    b.addEventListener('click', function () { doTrainAction(b.getAttribute('data-tr')); });
  });
  el('mInner').querySelectorAll('[data-reg]').forEach(function (b) {
    b.addEventListener('click', function () {
      registerRace(parseInt(b.getAttribute('data-reg'), 10),
                   parseInt(b.getAttribute('data-fee'), 10));
    });
  });
  el('rtPick').addEventListener('click', function (e) {
    const t = e.target.closest('[data-rt]');
    if (!t) return;
    updateMyRunType(t.getAttribute('data-rt'));
  });
  el('btnTrainClose').addEventListener('click', function () {
    isTrainingMode = false;
    hideModal();
    hidePanels(false);
    updatePanel();
  });
}

function doTrainAction(type) {
  if (type === 'breed') { showBreedingScreen(); return; }
  if (type === 'cond') { improveCondition(); return; }
  trainHorse(type);
}

function trainHorse(type) {
  if (isRacing || isFinished || hasTrained || !myHorseData || isPlayerEntered) return;
  if (myMoney < 100) { toast('メダルが足りません'); return; }
  myMoney -= 100;
  const h = myHorseData;
  h.trainingCount++;

  const isPastPeak = h.trainingCount > h.peak;
  const r = Math.random();
  let multi = 1.0;
  lastTrainingResult = '成功';
  if (r < 0.10) { multi = 3.0; lastTrainingResult = '超大成功'; }
  else if (r < 0.30) { multi = 1.5; lastTrainingResult = '大成功'; }

  const gain = isPastPeak ? rnd(-0.05, 0.05) : 0.2 * multi;

  if (type === 'speed') h.baseSpeed += gain;
  else if (type === 'spurt') h.spurtPower += gain;
  else if (type === 'guts') h.guts += gain;

  // 元仕様のバランス制約（SP と ST の差は 2.5 まで）
  if (Math.abs(h.baseSpeed - h.guts) > 2.5) {
    if (h.guts > h.baseSpeed) h.guts = h.baseSpeed + 2.5;
    else h.guts = h.baseSpeed - 2.5;
  }

  hasTrained = true;
  updateHUD();

  if (h.trainingCount >= 30) {
    showBreedingScreen();
  } else {
    updateTrainingScreen();
  }
}

function improveCondition() {
  if (isRacing || isFinished || !myHorseData || isPlayerEntered) return;
  if (myMoney < 50) { toast('メダルが足りません'); return; }
  myMoney -= 50;
  const idx = condIdx(myHorseData.condition);
  myHorseData.condition = COND_NAMES[Math.min(4, idx + 1 + ri(0, 1))];
  updateHUD();
  updateTrainingScreen();
}

function updateMyRunType(val) {
  if (!myHorseData) return;
  myHorseData.runType = val;
  myHorseData.skills = [makeSkill(val)];
  updateTrainingScreen();
}

function registerRace(rIdx, fee) {
  if (registeredRaces.indexOf(rIdx) >= 0) return;
  if (myMoney < fee) { toast('メダルが足りません！ 出走料 ' + fee + ' G'); return; }
  myMoney -= fee;
  registeredRaces.push(rIdx);
  updateHUD();
  updateTrainingScreen();
}

function timeText(sec) {
  if (!sec || !isFinite(sec) || sec <= 0) return '-';
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  const ss = s.toFixed(1);
  return (m > 0 ? m + ':' + (s < 10 ? '0' : '') : '') + ss;
}

function buildRankTableHTML() {

  for (let i = 0; i < sorted.length; i++) {

function saveGame() {
  if (!myHorseData) { toast('まだ馬がおらんで'); return; }
  const data = { m: myMoney, h: myHorseData, r: currentRaceIndex, reg: registeredRaces };
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));

  const raceInfoSave = getRaceInfo();
  const raceNameSave = raceInfoSave ? raceInfoSave.name : '不明';
  showModal(
    '<h1>セーブ</h1>' +
    '<div class="tag">' + myHorseData.name + ' ／ 獲得賞金 ' + fmt(myHorseData.prizeMoney || 0) +
    ' G ／ 所持金 ' + fmt(myMoney) + ' G ／ ' + raceNameSave + ' まで</div>' +
    '<div class="fld"><label>セーブコード</label>' +
    '<input id="saveCode" readonly value="' + code + '" ' +
    'style="font-size:10.5px;letter-spacing:0;font-weight:normal"></div>' +
    '<div class="row">' +
    '<button class="b-blue" id="btnCopy">コピー</button>' +
    '<button class="b-gray" id="btnCloseSave">閉じる</button></div>'
  );
  el('btnCopy').addEventListener('click', function () {
    const i = el('saveCode');
    i.select();
    try { document.execCommand('copy'); } catch (e) {}
    toast('コピーしたで');
  });
  el('btnCloseSave').addEventListener('click', hideModal);
}

function loadGame() {
  showModal(
    '<h1>ロード</h1>' +
    '<div class="tag">セーブコードを貼り付けてな</div>' +
    '<div class="fld"><label>セーブコード</label>' +
    '<input id="loadCode" placeholder="ここに貼り付け" ' +
    'style="font-size:10.5px;letter-spacing:0;font-weight:normal">' +
    '<div class="err" id="loadErr"></div></div>' +
    '<div class="row">' +
    '<button class="b-green" id="btnDoLoad">ロードする</button>' +
    '<button class="b-gray" id="btnCloseLoad">閉じる</button></div>'
  );
  el('btnCloseLoad').addEventListener('click', hideModal);
  el('btnDoLoad').addEventListener('click', function () {
    const code = (el('loadCode').value || '').trim();
    if (!code) return;

    if (code === 'もみがら') {
      myMoney = 99999;
      myHorseData = {
        name: 'サイレンススズカ', baseSpeed: 19.9, spurtPower: 1.8, guts: 19.9,
        runType: '大逃げ', coat: '#4e342e', silk: '#43a047',
        trainingCount: 0, peak: 30, wins: 0, condition: '絶好調',
        prizeMoney: 0, skills: [makeSkill('大逃げ')]
      };
      currentRaceIndex = 0;
      registeredRaces = [];
      isPlayerEntered = false;
      isRegistering = false;
      hideModal();
      updateHUD();
      resetRace();
      toast('デバッグモード: サイレンススズカ召喚');
      return;
    }

    if (code === '粉雪') {
      myMoney = 5000;
      myHorseData = {
        name: 'マオリンハンカチ', baseSpeed: 10, spurtPower: 2.2, guts: 13,
        runType: '追込', coat: '#d4a574', silk: '#e91e63',
        trainingCount: 0, peak: 20, wins: 0, condition: '絶好調',
        prizeMoney: 0, skills: [{ name: '限界突破', desc: '限界を超えた脚！まだ伸びる！まだ伸びるぞ！', boost: 1.0, cond: (p, r) => p > 0.95 && p < 0.99, used: false }]
      };
      currentRaceIndex = 0;
      registeredRaces = [];
      isPlayerEntered = false;
      isRegistering = false;
      hideModal();
      updateHUD();
      resetRace();
      toast('粉雪降る中、マオリンハンカチが登場したで');
      return;
    }

    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(code))));
      myMoney = o.m || 2000;
      myHorseData = o.h || null;
      currentRaceIndex = o.r || 0;
      registeredRaces = o.reg || [];
      isPlayerEntered = registeredRaces.indexOf(currentRaceIndex) >= 0;
      isRegistering = !myHorseData;
      hideModal();
      updateHUD();
      const raceInfoLoad = getRaceInfo();
      const raceNameLoad = raceInfoLoad ? raceInfoLoad.name : '不明';
      if (!myHorseData) showRegisterScreen();
      else resetRace();
      toast(raceNameLoad + ' までのデータをロードしたで');
    } catch (e) {
      el('loadErr').textContent = '不正なセーブコードや。';
    }
  });
}

function draw() {
  // --- パドックは手動スタート（自動発走なし） ---

  // --- 更新 ---
  if ((isRacing || isFinished) && !isRegistering && !isBreeding) {
    frameCount++;
    updateRace();
    if (isRacing && !isFinished) updateCommentary();
    updateCamera();
  } else {
    // パドック中もカメラは回す
    frameCount++;
    updateCamera();
  }

  // --- 3D描画 ---
  if (is3D && renderer3d && scene3d && camera3d) {
    updateHorseMeshes3D();
    updateCamera3D();
    renderer3d.render(scene3d, camera3d);
  }

  // --- 2D UIオーバーレイ ---
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);

  // 3Dモード時はUIだけ描画（背景はThree.jsが描画する）
  if (!is3D) {
    // 2Dモード時は従来通り全部描画
    drawSky();
    drawGround();
    drawTrackSurface();
    drawTrackLines();
    drawFencePosts();
  }

  if (!isRegistering && !isBreeding) {
    if (isPodium && winner) {
      if (!is3D) drawPodiumFx();
    } else if (!isReplaying && !isResultFlash) {
      if (!is3D) {
        drawGate(0, isRacing && (frameCount - raceStartTime >= 240) ? 1 : 0);
        drawHorses();
        drawDust();
      }
    }
  }

  // UI要素は常に描画
  updateRankPanel();
}

function loop(now) {
  const dt = Math.min(64, now - (lastT || now));
  lastT = now;
  draw();
  requestAnimationFrame(loop);
}

function createCourse3D() {

function createCoatTexture3D(colorHex) {
  const c = new THREE.Color(colorHex);
  const cvs = document.createElement('canvas'); cvs.width = 128; cvs.height = 128;
  const ctx = cvs.getContext('2d'); ctx.fillStyle = '#' + c.getHexString(); ctx.fillRect(0,0,128,128);
  for (let y=0; y<128; y+=4) { for (let x=0; x<128; x+=4) { const n = Math.random();
    const r = Math.floor(c.r*(0.7+n*0.6)*255), g = Math.floor(c.g*(0.7+n*0.6)*255), b = Math.floor(c.b*(0.7+n*0.6)*255);
    ctx.fillStyle = 'rgb('+r+','+g+','+b+')'; ctx.fillRect(x,y,4,4); } }
  return new THREE.CanvasTexture(cvs);
}

  numPlane.position.set(0, 40, -4); numPlane.rotation.x = -Math.PI/8; group.add(numPlane);

  const glowGeo = new THREE.SphereGeometry(28, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0 });
  const glow = new THREE.Mesh(glowGeo, glowMat); glow.position.y = 28; group.add(glow);

  scene3d.add(group);
  // 馬の上に番号スプライトを追加するで！
  const numCanvas2 = document.createElement('canvas');
  numCanvas2.width = 64;
  numCanvas2.height = 64;
  const numCtx2 = numCanvas2.getContext('2d');
  numCtx2.fillStyle = '#ffffff';
  numCtx2.beginPath();
  numCtx2.arc(32, 32, 30, 0, Math.PI * 2);
  numCtx2.fill();
  numCtx2.fillStyle = '#000000';
  numCtx2.font = 'bold 36px sans-serif';
  numCtx2.textAlign = 'center';
  numCtx2.textBaseline = 'middle';
  numCtx2.fillText(String(idx + 1), 32, 34);
  const numTexture2 = new THREE.CanvasTexture(numCanvas2);
  const numSpriteMat = new THREE.SpriteMaterial({ map: numTexture2, transparent: true });
  const numSprite = new THREE.Sprite(numSpriteMat);
  numSprite.position.set(0, 75, 0);
  numSprite.scale.set(22, 22, 1);
  group.add(numSprite);

  return { group, legGroups, glow, glowMat, numPlane, tailGroup, zekkenPlane, body, head, neck, jockeyGroup, whip };
}

function clearHorseMeshes3D() {
  for (const hm of horseMeshes3d) { scene3d.remove(hm.group); }
  horseMeshes3d = [];
}

function updateHorseMeshes3D() {
  if (!is3D || !scene3d) return;
  if (horseMeshes3d.length !== horses.length) {
    clearHorseMeshes3D();
    for (let i = 0; i < horses.length; i++) { const meshData = createHorseMesh3D(horses[i], i); horseMeshes3d.push(meshData); }
  }
  for (let i = 0; i < horses.length; i++) {
    const h = horses[i], hm = horseMeshes3d[i];
    if (!hm || !h.isParticipating) { if (hm) hm.group.visible = false; continue; }
    hm.group.visible = true;
    const pos = getTrackPos(h.d, h.laneOffset);
    hm.group.position.set(pos.x, 0, pos.z);
    let dir;
    if (h.d >= totalDistance && h.finishRank > 0) {
      // ゴール後は向きを固定（ゴール時の向きを保持）
      dir = travelDir(totalDistance - 10);
    } else {
      dir = travelDir(h.d);
    }
    hm.group.rotation.y = Math.atan2(dir.x, dir.z);
    const moving = h.speed > 0.6, gallop = h.speed > 7.5, t = h.legAngle;
    const AMP = gallop ? 0.55 : 0.28;
    const phases = gallop ? [0, Math.PI*0.62, Math.PI*1.18, Math.PI*1.72] : [0, Math.PI, Math.PI*0.5, Math.PI*1.5];
    for (let li = 0; li < 4; li++) { hm.legGroups[li].rotation.x = moving ? Math.sin(t + phases[li]) * AMP : 0; }
    hm.tailGroup.rotation.z = moving ? Math.sin(t*1.5)*0.25 : Math.sin(t*0.35)*0.05;
    hm.jockeyGroup.rotation.x = moving ? (gallop ? 0.78 : 0.40) + Math.sin(t)*0.045 : 0.24;
    hm.whip.visible = gallop && Math.sin(t*1.9) > 0.3;
    hm.glowMat.opacity = h.skillTimer > 0 ? 0.28 + Math.sin(performance.now()*0.012)*0.16 : 0;
  }
}

function updateCamera3D() {
  if (!is3D || !camera3d) return;
  const sorted = sortHorses();
  if (sorted.length === 0) return;
  const lead = sorted[0];
  const leadPos = getTrackPos(lead.d, lead.laneOffset);
  const elapsed = frameCount - raceStartTime;
  let tx, ty, tz, lx, ly, lz;

  if (!isRacing && !isFinished) {
    tx = leadPos.x + 230; ty = 165; tz = leadPos.z - 620;
    lx = leadPos.x; ly = 26; lz = leadPos.z + 40;
  } else if (isReplaying) {
    // リプレイ: ゴール線の真横から固定カメラ（写真判定風）
    const finishPos = getTrackPos(totalDistance, 0);
    tx = finishPos.x + 800; ty = 80; tz = finishPos.z;
    lx = finishPos.x; ly = 26; lz = finishPos.z;
  } else if (isPodium) {
    const w = winner || lead;
    const wp = getTrackPos(w.d, w.laneOffset);
    const dir = travelDir(w.d);
    tx = wp.x + dir.z*400 - dir.x*110; ty = 152; tz = wp.z - dir.x*400 - dir.z*110;
    lx = wp.x; ly = 30; lz = wp.z;
  } else if (lead.d > totalDistance - 1100) {
    const t = getRaceCamTarget();
    const aim = t ? t.aim : { x: leadPos.x, z: leadPos.z };
    const fp = getTrackPos(totalDistance, 0);
    const followZ = clamp(aim.z, fp.z - 1000, fp.z + 900);
    tx = fp.x - 640; ty = 178; tz = followZ - 330;
    lx = aim.x; ly = 26; lz = aim.z - 40;
  } else if (elapsed < 240) {
    const t = clamp(elapsed/240, 0, 1);
    const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
    const radius = lerp(820, 1000, ease);
    const ang = lerp(Math.atan2(-200, 1200), Math.PI*0.75, ease);
    tx = Math.cos(ang)*radius; ty = lerp(230, 205, ease); tz = Math.sin(ang)*radius;
    lx = 0; ly = 24; lz = lerp(120, 0, ease);
  } else if (elapsed < 540) {
    const t = getRaceCamTarget();
    const aim = t ? t.aim : { x: leadPos.x, z: leadPos.z };
    tx = aim.x + Math.cos(Math.PI*0.75)*1150; ty = 205; tz = aim.z + Math.sin(Math.PI*0.75)*1150;
    lx = aim.x; ly = 24; lz = aim.z;
  } else {
    // 先頭争いで狙いが飛ばないよう、2D側と同じ「なました注視点」を使う
    const t = getRaceCamTarget();
    if (t) { tx = t.x; ty = t.y; tz = t.z; lx = t.tx; ly = t.ty; lz = t.tz; }
    else { tx = camera3d.position.x; ty = camera3d.position.y; tz = camera3d.position.z; lx = leadPos.x; ly = 24; lz = leadPos.z; }
  }

  // 3Dは毎フレーム瞬間移動させずに減衰追従（ガタつき防止）
  const sm = camState.smooth3d;
  if (!sm.init) {
    sm.x = tx; sm.y = ty; sm.z = tz;
    sm.tx = lx; sm.ty = ly; sm.tz = lz;
    sm.init = true;
  }
  const KP = 0.14;   // カメラ位置の追従
  const KL = 0.22;   // 注視点の追従
  sm.x = lerp(sm.x, tx, KP); sm.y = lerp(sm.y, ty, KP); sm.z = lerp(sm.z, tz, KP);
  sm.tx = lerp(sm.tx, lx, KL); sm.ty = lerp(sm.ty, ly, KL); sm.tz = lerp(sm.tz, lz, KL);

  camera3d.position.set(sm.x, sm.y, sm.z);
  camera3d.lookAt(sm.tx, sm.ty, sm.tz);
}

function init() {
  cv = el('cv');
  g = cv.getContext('2d');

  // Three.js 3D初期化
  initThreeJS();

  // CanvasをUIレイヤーとして前面に
  cv.style.position = 'fixed';
  cv.style.top = '0';
  cv.style.left = '0';
  cv.style.width = '100%';
  cv.style.height = '100%';
  cv.style.zIndex = '10';
  cv.style.pointerEvents = 'none';
  if (!g) {
    const b = el('errbox');
    b.style.display = 'block';
    b.textContent = 'Canvas 2D コンテキストが取得できません。ブラウザを変えてみてな。';
    return;
  }
  resize();
  window.addEventListener('resize', resize);

  el('btnTrain').addEventListener('click', function () {
    if (!myHorseData) { showRegisterScreen(); return; }
    toggleTrainingScreen();
  });
  el('btnSave').addEventListener('click', saveGame);
  el('btnLoad').addEventListener('click', loadGame);

  // 登録画面からスタート
  showRegisterScreen();

  // スタートボタンは馬券パネル側にあるで

  // メインループ
  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
