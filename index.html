<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LET'S HORSES - 競馬シミュレーション</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%}

/* HUD */
#hud{position:absolute;left:18px;top:12px;z-index:50;pointer-events:none;
  text-shadow:2px 2px 6px rgba(0,0,0,.9)}
#timer{font-size:19px;font-weight:bold;letter-spacing:.5px}
#money{font-size:23px;font-weight:bold;color:#ffd23f;margin-top:1px}
#raceinfo{font-size:12.5px;color:#b0bec5;margin-top:3px;letter-spacing:.3px}
#hstats{font-size:12px;color:#8fa8b8;margin-top:5px;line-height:1.55}

/* 出馬表パネル（左側固定） */
#cardPanel{position:absolute;left:14px;top:12px;width:420px;max-height:calc(100vh - 26px);
  z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(165deg,rgba(16,20,26,.97),rgba(5,7,9,.98));
  border:1px solid rgba(255,255,255,.10);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.8);overflow:hidden}
#cardBody{overflow-y:auto;padding:12px 14px 14px;font-size:12.5px}
#cardBody::-webkit-scrollbar{width:7px}
#cardBody::-webkit-scrollbar-thumb{background:#37474f;border-radius:4px}

/* 馬券パネル（右側固定） */
#betPanel{position:absolute;right:14px;top:12px;width:380px;max-height:calc(100vh - 26px);
  z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(165deg,rgba(16,20,26,.97),rgba(5,7,9,.98));
  border:1px solid rgba(255,255,255,.10);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.8);overflow:hidden}
#betBody{overflow-y:auto;padding:12px 14px 14px;font-size:12.5px}
#betBody::-webkit-scrollbar{width:7px}
#betBody::-webkit-scrollbar-thumb{background:#37474f;border-radius:4px}

/* フォーメーションUI */
.form-box{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
.form-box div{padding:7px 2px;text-align:center;font-size:11.5px;font-weight:bold;
  border-radius:7px;background:rgba(255,255,255,.055);border:1.5px solid transparent;
  cursor:pointer;color:#cbd5e1;transition:.13s}
.form-box div:hover{background:rgba(255,255,255,.11)}
.form-box div.on{border-color:#4dd0e1;background:rgba(77,208,225,.18);color:#4dd0e1}
.form-box div.me{box-shadow:inset 0 0 0 1px rgba(255,210,63,.6)}
.form-box div.dim{opacity:.35;cursor:not-allowed}
.form-label{font-size:10px;color:#78909c;margin:8px 0 4px;letter-spacing:.5px;font-weight:bold}
.form-summary{padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.05);
  font-size:11px;color:#b0bec5;margin-top:6px;line-height:1.5}
.form-summary b{color:#ffd23f}/* 実況 */
#comment{position:absolute;left:18px;bottom:84px;z-index:45;
  max-width:min(700px,52vw);
  background:linear-gradient(90deg,rgba(8,14,18,.94),rgba(8,14,18,.55));
  border-left:4px solid #4dd0e1;border-radius:5px;padding:9px 15px;font-size:13.5px;
  font-weight:bold;line-height:1.65;letter-spacing:.3px;pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.6)}
#payout{position:absolute;left:18px;bottom:176px;z-index:45;
  background:rgba(8,14,18,.92);border-left:4px solid #ffd23f;border-radius:5px;
  padding:8px 14px;font-size:13px;font-weight:bold;color:#ffd23f;line-height:1.6;
  pointer-events:none;display:none}

/* 順位表 */
#rank{position:absolute;right:14px;top:12px;z-index:100;width:230px;
  background:linear-gradient(180deg,rgba(16,21,26,.92),rgba(0,0,0,.92));
  border-left:3px solid #ff9800;border-radius:7px;padding:10px 12px;font-size:11.5px;
  line-height:1.6;pointer-events:none;display:none;
  box-shadow:-4px 4px 18px rgba(0,0,0,.6)}
#rank .rt{display:flex;justify-content:space-between;gap:5px}
#rank .rt span:first-child{color:#ffd23f;font-weight:bold}

/* ボタン */
#btnbar{position:absolute;left:18px;bottom:16px;z-index:60;display:flex;gap:8px}
button{font-family:inherit;font-weight:bold;cursor:pointer;border:none;
  border-radius:8px;color:#fff;transition:transform .1s,filter .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:not-allowed}
.b-orange{background:linear-gradient(135deg,#ff9800,#ef6c00);padding:11px 20px;
  font-size:15px;box-shadow:0 4px 14px rgba(255,152,0,.35)}
.b-blue{background:linear-gradient(135deg,#2196f3,#1565c0);padding:9px 15px;font-size:12.5px}
.b-green{background:linear-gradient(135deg,#4caf50,#2e7d32);padding:9px 15px;font-size:12.5px}
.b-gray{background:linear-gradient(135deg,#546e7a,#37474f);padding:9px 15px;font-size:12.5px}
.b-red{background:linear-gradient(135deg,#ef5350,#c62828);padding:9px 15px;font-size:12.5px}
.b-purple{background:linear-gradient(135deg,#9c27b0,#6a1b9a);padding:9px 15px;font-size:12.5px}
.b-cyan{background:linear-gradient(135deg,#00acc1,#00838f);padding:9px 15px;font-size:12.5px}

/* モーダル */
#modal{position:absolute;inset:0;z-index:300;display:none;align-items:center;
  justify-content:center;background:rgba(2,4,6,.86);backdrop-filter:blur(4px);
  padding:20px;overflow-y:auto}
#modal.on{display:flex}
#mInner{width:min(720px,95vw);max-height:92vh;overflow-y:auto;
  background:linear-gradient(165deg,rgba(20,25,31,.99),rgba(7,9,12,.99));
  border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;
  box-shadow:0 26px 70px rgba(0,0,0,.92)}
#mInner::-webkit-scrollbar{width:8px}
#mInner::-webkit-scrollbar-thumb{background:#37474f;border-radius:4px}
h1{font-size:25px;text-align:center;letter-spacing:2px;margin-bottom:3px;
  background:linear-gradient(90deg,#ffd23f,#ff9800);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
h1.pink{background:linear-gradient(90deg,#f06292,#e91e63);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.tag{text-align:center;color:#8fa4b3;font-size:12px;margin-bottom:18px;letter-spacing:.6px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:#8fa4b3;margin-bottom:6px;letter-spacing:.5px}
.fld input{width:100%;padding:11px 14px;font-size:16px;font-family:inherit;
  font-weight:bold;background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;
  outline:none;letter-spacing:2px}
.fld input:focus{border-color:#ffd23f;background:rgba(255,210,63,.08)}
.hint{font-size:11px;color:#5c7180;margin-top:5px}
.err{font-size:11.5px;color:#ef5350;margin-top:5px;min-height:15px}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.cand{padding:13px;border-radius:12px;cursor:pointer;transition:.15s;
  background:linear-gradient(135deg,rgba(28,33,39,.9),rgba(12,13,15,.95));
  border:2px solid rgba(255,255,255,.13)}
.cand:hover{border-color:rgba(255,255,255,.3)}
.cand.on{border-color:#ff9800;transform:scale(1.03);
  box-shadow:0 6px 20px rgba(255,152,0,.3)}
.cand .t{font-size:13px;font-weight:bold;margin-bottom:6px;color:#fff}
.cand .s{font-size:11px;color:#9aa8b5;display:flex;justify-content:space-between;
  margin-top:2px}
.cand .s b{color:#7ee787}
.cand .price{font-size:11px;color:#ffd23f;margin-top:6px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sbox{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:10px;text-align:center}
.sbox .k{font-size:10px;color:#8fa4b3;letter-spacing:.5px}
.sbox .v{font-size:20px;font-weight:bold;color:#ffd23f;margin-top:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;
  margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#ffd23f,#ff9800)}
.tlist{display:grid;gap:8px}
.titem{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:11px 14px}
.titem .a{font-weight:bold;font-size:13px}
.titem .b{font-size:11px;color:#8fa4b3;margin-top:2px}
.titem button{padding:7px 14px;font-size:12px;border-radius:7px}
.resrow{display:flex;justify-content:space-between;padding:7px 12px;margin-bottom:4px;
  border-radius:7px;background:rgba(255,255,255,.045);align-items:center;font-size:12.5px}
.resrow.w{background:linear-gradient(90deg,rgba(255,210,63,.22),rgba(255,210,63,.04));
  border:1px solid rgba(255,210,63,.4)}
.resrow.me{box-shadow:inset 2px 0 0 #ffd23f}
.resrow .p{font-size:15px;font-weight:bold;width:28px;color:#ffd23f}
.resrow .n{flex:1;padding-left:4px}
.resrow .o{font-size:11px;color:#8fa4b3;width:44px;text-align:right}
.resrow .m{font-size:11px;color:#4dd0e1;width:58px;text-align:right}
.big{font-size:15px;font-weight:bold;color:#ffd23f;text-align:center;margin-top:12px;
  line-height:1.7}
.sub2{text-align:center;font-size:11.5px;color:#8fa4b3;margin-top:8px;line-height:1.6}
.hide{display:none!important}

.sharebar{grid-column:2 / span 5;display:flex;gap:4px;align-items:center;
  padding:1px 0 3px 2px;flex-wrap:wrap}
.sharebar button{background:linear-gradient(135deg,#4caf50,#2e7d32);border:none;
  color:#fff;font-size:9.5px;font-weight:bold;padding:2px 6px;border-radius:4px;
  cursor:pointer;font-family:inherit}
.sharebar button.b10{background:linear-gradient(135deg,#2196f3,#1565c0)}
.sharebar button:active{transform:scale(.95)}
.sharebar .sh{font-size:9.5px;color:#ffd23f;font-weight:bold}
#errbox{position:absolute;left:0;top:0;right:0;z-index:999;background:#b71c1c;
  color:#fff;font:11px monospace;padding:8px 12px;white-space:pre-wrap;
  max-height:30vh;overflow:auto;display:none}

  /* フォーメーションUI用スタイル */
  .form-label { font-size: 11px; color: #8fa4b3; margin: 8px 0 4px; padding-left: 2px; }
  .form-box { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .form-box > div {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid #334155;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; cursor: pointer;
    background: #0b1220; color: #e2e8f0; user-select: none;
    transition: background .15s, border-color .15s;
  }
  .form-box > div:hover { background: #162032; border-color: #60a5fa; }
  .form-box > div.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .form-box > div.me { border-color: #f59e0b; color: #fbbf24; }
  .form-box > div.dim { opacity: .45; }  /* 別枠で選択中：押すと入れ替え */
  .form-summary {
    font-size: 11px; color: #94a3b8; background: #0f172a;
    border: 1px solid #1e293b; border-radius: 8px; padding: 6px 8px;
    margin: 6px 0;
  }
  .form-summary b { color: #60a5fa; margin-right: 4px; }

  /* 馬券パネル側のスタート／出馬表ボタン */
  .raceStartRow { display: flex; gap: 8px; margin-bottom: 10px }
  .raceStart { flex: 1 1 auto; background: #2563eb; border-radius: 9px;
    padding: 12px 0; font-size: 14px; font-weight: 700; color: #fff; border: none;
    cursor: pointer }
  .raceStart:hover { background: #1d4ed8 }
  .raceStart.sub { flex: 0 0 auto; background: #37474f; padding: 12px 14px;
    font-size: 13px }
  .raceStart.sub:hover { background: #455a64 }

/* ============ レイアウト最終調整（左=出馬表 / 右=馬券 の固定2カラム） ============ */
#cardPanel{top:96px !important;bottom:82px !important;left:14px !important;
  width:620px !important;max-height:none !important}
/* 育成・セーブ・ロードは常に出るよう、出馬表の下に確保 */
/* 育成・セーブ・ロードは、パドック中でも押せるようオーバーレイの上に置く */
#btnbar{position:absolute;left:18px !important;bottom:16px !important;
  z-index:255 !important;background:rgba(6,10,14,.55);border-radius:10px;
  padding:5px 6px;backdrop-filter:blur(3px)}
#btnbar .b-orange{padding:10px 18px !important;font-size:14px !important}
#btnbar .b-blue,#btnbar .b-green{padding:9px 14px !important;font-size:12px !important}
#betPanel{top:96px !important;bottom:16px !important;right:14px !important;
  width:380px !important;max-height:none !important}
#cardBody,#betBody{flex:1 1 auto;min-height:0}
/* 実況・配当・順位はパネルに被らんよう、左右の間だけに収める */
#comment{left:648px !important;right:404px !important;bottom:18px !important;
  max-width:none !important;width:auto !important}
#payout{left:648px !important;right:404px !important;bottom:86px !important;
  max-width:none !important;width:auto !important}
#rank{left:648px !important;right:auto !important;top:96px !important;
  bottom:auto !important;width:230px}
@media (max-width:1180px){
  #cardPanel{width:340px !important}
  #betPanel{width:320px !important}
  #rank{left:548px !important;width:200px}
  #comment{left:548px !important;right:344px !important}
  #payout{left:548px !important;right:344px !important}
}

/* ============ 競馬新聞ふう出馬表（コンパクト） ============ */
.np-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  border-bottom:2px solid #ffd23f;padding-bottom:5px;margin-bottom:4px}
.np-head b{font-size:13.5px;letter-spacing:1.2px;color:#ffd23f;white-space:nowrap}
.np-head span{font-size:11px;color:#ff9800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sub{font-size:10.5px;color:#8fa4b3;margin-bottom:6px}
.np-table{border:1px solid #263238;border-radius:6px;overflow:hidden;
  font-variant-numeric:tabular-nums}
.np-row{display:grid;grid-template-columns:20px 20px 24px 1fr 38px 42px 26px 46px 54px;
  align-items:center;gap:4px;padding:3px 5px;font-size:11.5px;
  border-bottom:1px solid #1b2429;line-height:1.35}
.np-row:last-child{border-bottom:none}
.np-row:nth-child(even){background:rgba(255,255,255,.022)}
.np-row.mine{background:rgba(255,210,63,.10);box-shadow:inset 3px 0 0 #ffd23f}
.np-row.np-hd{background:#101a1f;font-size:9.5px;color:#78909c;letter-spacing:.4px;
  font-weight:700;padding:4px 5px}
.np-w{text-align:center;font-weight:700;font-size:10.5px;border-radius:3px;line-height:15px}
.np-num{text-align:center;font-weight:700;color:#ffffff;font-size:12px;
  background:rgba(255,255,255,.10);border-radius:3px;line-height:15px}
.np-name{white-space:nowrap;overflow:hidden;font-weight:600}
.np-name i{font-style:normal;font-size:9.5px;color:#66bb6a;font-weight:400}
.np-name em{font-style:normal;font-size:9.5px;color:#ffb74d}
.np-rt{text-align:center;font-size:10px;border-radius:3px;padding:1px 0;font-weight:700}
.np-cond{text-align:center;font-size:10px;font-weight:700}
.np-pop{text-align:center;font-size:10.5px;color:#90a4ae}
.np-odds{text-align:right;font-weight:700;color:#4dd0e1;padding-right:2px}
.np-buy{font-size:9.5px;padding:3px 0;border-radius:4px;background:#2b3a45;color:#cfd8dc;
  border:none;cursor:pointer;font-weight:700}
.np-buy:hover{background:#37474f}
.np-buy:disabled{opacity:.35;cursor:not-allowed}
.np-foot{font-size:10.5px;color:#ffb74d;text-align:center;margin-top:7px}

/* 新聞の最終微調整 */
#cardBody{padding:9px 10px 10px}

/* ============ 馬券パネル（復元） ============ */
.betsec{margin-bottom:9px}
.betlabel{font-size:10.5px;color:#8fa4b3;margin-bottom:5px;letter-spacing:.4px;font-weight:700}
.bettypes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bettypes>div{text-align:center;font-size:11px;padding:6px 0;border-radius:5px;
  background:#16202a;color:#b0bec5;cursor:pointer;border:1px solid #22303c;
  user-select:none;transition:background .12s}
.bettypes>div:hover{background:#1e2b36}
.bettypes>div.on{background:#ffd23f;color:#101418;font-weight:700;border-color:#ffd23f}
.horsegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.horsegrid>div{height:38px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;line-height:1.1;
  border-radius:5px;background:#16202a;border:1px solid #22303c;font-size:12px;
  font-weight:700;cursor:pointer;color:#e2e8f0;user-select:none;
  transition:background .12s,border-color .12s}
.horsegrid>div .hn{font-size:12px;font-weight:700}
.horsegrid>div .ho{font-size:9px;font-weight:400;color:#4dd0e1;margin-top:1px}
.horsegrid>div.on .ho{color:#fff}
.horsegrid>div:hover{background:#1e2b36;border-color:#4dd0e1}
.horsegrid>div.on{background:#e53935;border-color:#e53935;color:#fff}
.horsegrid>div.me{border-color:#ffd23f;color:#ffd23f}
.horsegrid>div.me.on{color:#fff}
.oddbox{display:flex;justify-content:space-between;align-items:center;
  background:#101a1f;border:1px solid #22303c;border-radius:6px;
  padding:7px 10px;font-size:11.5px;margin-top:8px}
.oddbox b{color:#4dd0e1;font-size:13px}
.stakes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.stakes>div{text-align:center;font-size:11px;padding:6px 0;border-radius:5px;
  background:#16202a;border:1px solid #22303c;cursor:pointer;user-select:none}
.stakes>div:hover{background:#1e2b36}
.stakes>div.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700}
.betbtn{width:100%;margin-top:11px;padding:11px 0;border-radius:8px;
  background:#43a047;color:#fff;font-size:13.5px;font-weight:700;
  border:none;cursor:pointer}
.betbtn:hover:not(:disabled){background:#4caf50}
.betbtn:disabled{background:#37474f;color:#90a4ae;opacity:.55;cursor:not-allowed}
.tickets{margin-top:12px;border-top:1px solid #22303c;padding-top:9px}
.ticket{display:flex;justify-content:space-between;align-items:center;
  font-size:11px;padding:5px 0;border-bottom:1px solid #1b2429;gap:6px}
.ticket:last-child{border-bottom:none}
.ticket .tk{color:#4dd0e1;font-weight:700}
.empty{font-size:11px;color:#78909c;text-align:center;padding:8px 0}
.raceState{font-size:11.5px;color:#4dd0e1;font-weight:700;text-align:center;
  padding:6px 0 8px;letter-spacing:.4px}

/* レース中は実況・順位・配当を画面幅いっぱいに使う */
body.racing #comment{left:366px !important;right:14px !important;bottom:18px !important;
  max-width:min(880px,calc(100vw - 392px)) !important}
body.racing #payout{left:366px !important;right:auto !important;bottom:96px !important;
  max-width:min(880px,calc(100vw - 392px)) !important}
body.racing #rank{left:auto !important;right:14px !important;top:12px !important;
  bottom:auto !important;width:230px}

/* ============ ゴール後の結果フラッシュ ============ */
#resultFlash{position:absolute;inset:0;z-index:265;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(circle at 50% 28%,rgba(12,20,28,.93),rgba(3,5,8,.975))}
#resultFlash.on{display:flex}
#rfInner{width:min(1120px,96vw);max-height:94vh;overflow-y:auto;
  background:linear-gradient(165deg,rgba(20,26,33,.99),rgba(6,9,12,.99));
  border:1px solid rgba(255,210,63,.34);border-radius:16px;padding:18px 22px;
  box-shadow:0 26px 70px rgba(0,0,0,.92)}
#rfInner::-webkit-scrollbar{width:8px}

function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function condMult(c) { const i = COND_NAMES.indexOf(c); return i < 0 ? 1 : COND_MULT[i]; }
function condIdx(c) { return Math.max(0, COND_NAMES.indexOf(c)); }

function getTrackPos(d, lane) {
  if (d < trackS1) {
    return { x: lane, z: d, angle: 0 };
  } else if (d < trackS1 + trackC1) {
    const theta = (d - trackS1) / trackR;
    const r = trackR + lane;
    return { x: -trackR + r * Math.cos(theta), z: trackS1 + r * Math.sin(theta), angle: theta };
  } else {
    const d2 = d - (trackS1 + trackC1);
    return { x: -2 * trackR - lane, z: trackS1 - d2, angle: Math.PI };
  }
}

function project(wx, wy, wz) {
  const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const fx = sy * cp, fy = -sp, fz = cy * cp;
  const rx = cy, rz = -sy;
  const ux = sy * sp, uy = cp, uz = cy * sp;
  const depth = dx * fx + dy * fy + dz * fz;
  if (depth < 14) return null;
  const sx = dx * rx + dz * rz;
  const su = dx * ux + dy * uy + dz * uz;
  const f = cam.focal / depth;
  return { x: W * 0.5 + sx * f, y: H * 0.52 - su * f, s: f, d: depth };
}

function horizonY() {
  return clamp(H * 0.52 - Math.tan(cam.pitch) * cam.focal, H * 0.05, H * 0.94);
}

function travelDir(d) {
  const a = getTrackPos(Math.max(0, d - 60), 0);
  const b = getTrackPos(Math.min(totalDistance, d + 60), 0);
  let vx = b.x - a.x, vz = b.z - a.z;
  const L = Math.hypot(vx, vz) || 1;
  return { x: vx / L, z: vz / L };
}

// 元仕様 getMarginText
function getMarginText(diffFrame) {
  if (diffFrame <= 0.0001) return '同着';
  const margin = diffFrame * 0.3;
  if (margin >= 10) return '大差';
  let intPart = Math.floor(margin);
  let frac = margin - intPart;
  let fracStr = '';
  if (intPart === 0) {
    if (margin < 0.3) return 'ハナ';
    if (margin < 0.6) return 'アタマ';
    if (margin < 0.85) return 'クビ';
    return '3/4 馬身';
  }
  if (frac < 0.125) fracStr = '';
  else if (frac < 0.375) fracStr = '1/4';
  else if (frac < 0.625) fracStr = '1/2';
  else if (frac < 0.875) fracStr = '3/4';
  else { intPart++; fracStr = ''; }
  if (intPart === 0) return fracStr + '馬身';
  return intPart + (fracStr ? ' ' + fracStr : '') + '馬身';
}

// ------------------------------------------------------------
// 4. 馬の生成（元仕様を忠実に再現）
// ------------------------------------------------------------
function generateCandidate(baseMultiplier) {
  baseMultiplier = baseMultiplier || 1.0;
  const runTypes = ['逃げ', '先行', '差し', '追込'];
  return {
    baseSpeed:  rnd(8.5, 9.5) * baseMultiplier,
    spurtPower: rnd(1.3, 1.8) * baseMultiplier,
    guts:       rnd(8.5, 11.0) * baseMultiplier,
    runType:    pick(runTypes),
    coat:       pick(COAT_COLORS),
    silk:       pick(SILKS),
    trainingCount: 0,
    peak:       ri(12, 22)
  };
}

function resetRace() {
  horses = [];
  const usedNames = [];
  packState = pick(['縦長', '横長', '普通']);
  racePace  = pick(['ハイペース', '平均ペース', 'スローペース']);

  const raceInfo = getRaceInfo();
  const gradeMult = raceInfo.mult;

  // --- 未勝利戦なら相手も弱めに ---
  const totalNPC = isPlayerEntered ? numHorses - 1 : numHorses;

  // 脚質の割り振り（元仕様：逃げ先行差し追込の巡回 + 70%で大逃げ1頭）
  const baseRunTypes = [];
  for (let i = 0; i < totalNPC; i++) baseRunTypes.push(RT_BASE[i % 4]);
  if (Math.random() < 0.7) {
    baseRunTypes[ri(0, totalNPC - 1)] = '大逃げ';
  }

  // マッチレース（5%）／モンスター（10%）
  const isMatchRace = Math.random() < 0.05;
  let match1 = -1, match2 = -1, monsterIndex = -1;
  if (isMatchRace && totalNPC >= 2) {
    match1 = ri(0, totalNPC - 1);
    do { match2 = ri(0, totalNPC - 1); } while (match2 === match1);
    baseRunTypes[match1] = '逃げ';
    baseRunTypes[match2] = '逃げ';
  } else {
    monsterIndex = Math.random() < 0.10 ? ri(0, totalNPC - 1) : -1;
  }

  // --- NPC 生成 ---
  const npcHorses = [];
  for (let i = 0; i < totalNPC; i++) {
    const rType = baseRunTypes[i];
    let spurtP;
    let eType = '通常';
    if (rType === '大逃げ')      { spurtP = rnd(1.20, 1.40); eType = pick(['大', '中']); }
    else if (rType === '逃げ')   spurtP = rnd(1.40, 1.55);
    else if (rType === '先行')   spurtP = rnd(1.50, 1.65);
    else if (rType === '差し')   spurtP = rnd(1.60, 1.75);
    else                          spurtP = rnd(1.70, 1.85);

    const isMatch = (i === match1 || i === match2);
    const isMonster = (i === monsterIndex) || isMatch;

    // 名前は脚質別プールから（重複回避）
    const pool = NAME_POOL[rType] || NAME_POOL['先行'];
    let avail = pool.filter(function (n) { return usedNames.indexOf(n) < 0; });
    if (avail.length === 0) avail = pool;
    const horseName = pick(avail);
    usedNames.push(horseName);

    // 能力値（元仕様どおり）
    let speedVal = isMatch ? rnd(9.3, 9.5) : rnd(8.7, 9.3);
    let spurtVal = (isMonster ? spurtP * 1.5 : spurtP * rnd(0.85, 1.15)) * (isMatch ? 1.6 : 1.5);
    const gutsDiff = isMonster ? rnd(1.0, 2.5) : rnd(-2.5, 1.5);
    let gutsVal = speedVal + gutsDiff;

    const condition = pick(COND_NAMES);
    const m = condMult(condition);

    // 未勝利戦は相手を下方補正（新馬が勝てるように）
    const maidenAdj = (raceInfo.grade === '未勝利戦') ? 0.92 : 1.0;

    speedVal *= m * gradeMult * maidenAdj;
    spurtVal *= m * gradeMult * maidenAdj;
    gutsVal  *= m * gradeMult * maidenAdj;

    if (Math.abs(speedVal - gutsVal) > 2.5) {
      gutsVal = (gutsVal > speedVal) ? speedVal + 2.5 : speedVal - 2.5;
    }

    npcHorses.push({
      name: horseName,
      baseSpeed: speedVal,
      spurtPower: spurtVal,
      guts: gutsVal,
      condition: condition,
      runType: rType,
      escapeType: eType,
      isMonster: isMonster,
      isMatch: isMatch,
      coat: pick(COAT_COLORS),
      silk: pick(SILKS),
      isMyHorse: false
    });
  }

  // --- 自分の馬 ---
  if (isPlayerEntered && myHorseData) {
    const m = condMult(myHorseData.condition);
    horses.push({
      name: myHorseData.name,
      baseSpeed: myHorseData.baseSpeed * m,
      spurtPower: myHorseData.spurtPower * m,
      guts: myHorseData.guts * m,
      condition: myHorseData.condition,
      runType: myHorseData.runType,
      escapeType: '通常',
      isMonster: false,
      isMatch: false,
      coat: myHorseData.coat,
      silk: myHorseData.silk,
      isMyHorse: true
    });
  }
  horses = horses.concat(npcHorses);

  // --- 個体セットアップ ---
  for (let i = 0; i < horses.length; i++) {
    const h = horses[i];
    h.id = i + 1;
    h.laneOffset = -160 + (320 / (numHorses - 1)) * i;
    h.d = -10;
    h.speed = 0;
    h.legAngle = rnd(0, Math.PI * 2);
    h.finishRank = 0;
    h.finishFrame = 0;
    h.popularity = 0;
    h.odds = 0;
    h.lateStartDelay = 0;
    h.isLateStart = false;
    h.whipTimer = 0;
    h.whipBoost = 0;
    h.whipCooldown = 0;
    h.dustTimer = 0;
    h.skillTimer = 0;
    h.skillBoost = 0;
    h.isParticipating = true;
    h.abilityScore = (h.baseSpeed * 2.0) + (h.spurtPower * 1.5) + ((h.guts / 9.0) * 1.0);
    h.abilityScore *= rnd(0.95, 1.05);
    // --- スタミナシステム ---
    h.stamina = h.guts * 12;          // レース中の残スタミナ
    h.maxStamina = h.stamina;
    h.spurtTriggered = false;         // 逆算仕掛け済みフラグ

    // スキル（元仕様：脚質一致 or 全 から1つ）
    if (h.isMyHorse && myHorseData) {
      if (!myHorseData.skills || myHorseData.skills.length === 0) {
        myHorseData.skills = [makeSkill(h.runType)];
      }
      h.skills = myHorseData.skills.map(function (s) {
        const orig = ALL_SKILLS.find(function (x) { return x.name === s.name; });
        return { name: s.name, desc: s.desc, boost: s.boost, cond: orig ? orig.cond : function () { return false; }, used: false };
      });
    } else {
      h.skills = [makeSkill(h.runType)];
    }
  }

  // --- 出遅れ（5%） ---
  if (Math.random() < 0.05) {
    const idx = ri(0, horses.length - 1);
    horses[idx].lateStartDelay = ri(30, 80);
    horses[idx].isLateStart = true;
    horses[idx].guts *= 0.9;
  }

  // --- オッズ（能力スコア → 勝率 → 単勝オッズ。馬券オッズもこの勝率から作る） ---
  const sortedByAbility = horses.slice().sort(function (a, b) { return b.abilityScore - a.abilityScore; });
  const nOdds = sortedByAbility.length;
  let meanAb = 0;
  sortedByAbility.forEach(function (h) { meanAb += h.abilityScore; });
  meanAb /= nOdds;
  let varAb = 0;
  sortedByAbility.forEach(function (h) {
    const dv = h.abilityScore - meanAb;
    varAb += dv * dv;
  });
  const sdAb = Math.sqrt(varAb / nOdds) || 1;
  const K_ODDS  = 1.15;    // 能力差が勝率に効く強さ
  const P_FLOOR = 0.008;   // 最低勝率（＝最大オッズ約100倍）

  let rawW = sortedByAbility.map(function (h) {
    return Math.exp(K_ODDS * ((h.abilityScore - meanAb) / sdAb));
  });
  let sumRaw = rawW.reduce(function (a, b) { return a + b; }, 0) || 1;
  let pList = rawW.map(function (x) { return Math.max(P_FLOOR, x / sumRaw); });
  const sumP = pList.reduce(function (a, b) { return a + b; }, 0) || 1;
  pList = pList.map(function (x) { return x / sumP; });

  for (let i = 0; i < nOdds; i++) {
    const h = sortedByAbility[i];
    h.popularity = i + 1;
    h.winProb = pList[i];
    // 単勝控除率20% → オッズ = 0.8 / 勝率
    const o = 0.8 / h.winProb;
    h.odds = Math.max(1.1, o < 10 ? Math.round(o * 10) / 10 : Math.round(o));
    // 下限1.1で丸めた分のズレを吸収
    h.winProb = Math.min(0.99, 0.8 / h.odds);
  }
  horses.forEach(function (h) { h.oddsStr = h.odds.toFixed(1); });

  // --- レース状態リセット ---
  isRacing = false;
  isFinished = false;
  isReplaying = false;
  isPodium = false;
  winner = null;
  frameCount = 0;
  raceStartTime = 0;
  currentFinishRank = 1;
  gateOpenRatio = 0;
  replayFrames = [];
  replayIndex = 0;
  replayThirdIndex = 0;
  allFinishedTime = 0;
  podiumStartTime = 0;
  top3Horses = [];
  prizeAwarded = false;
  ownedShares = {};
  tickets = [];
  betPicksByType = {};
  lastPayout = 0;
  lastPrize = 0;
  currentPhase = -1;
  isResultFlash = false;
  resultFlashStart = 0;
  resultModalShown = false;
  resetCameraState();
  const rf = el('resultFlash');
  if (rf) rf.classList.remove('on');

  if (!isRegistering && !isBreeding) {
    commentaryLog = ['各馬ゲートイン完了。出馬表を確認してスタートしてください。'];
    el('comment').innerHTML = commentaryLog.join('<br>');
    hasTrained = false;
    paddockStartTime = performance.now();
    isTrainingMode = false;
    panelsHidden = false;  // 左パネルを必ず表示
    // パドックオーバーレイは updatePanel() → syncPanels() の連鎖で
    // 毎回開き直されるバグを防ぐため、ここでは開かない。
    // 出馬表は左パネル（cardPanel）で常に見えるようにするで。
    updatePanel();
    updateHUD();
  }
}

function makeSkill(runType) {
  const avail = ALL_SKILLS.filter(function (s) { return s.rt === runType || s.rt === '全'; });
  const pool = avail.length ? avail : ALL_SKILLS;
  const s = pick(pool);
  return { name: s.name, desc: s.desc, boost: s.boost, cond: s.cond, used: false };
}

// ------------------------------------------------------------
// 5. レースロジック（元仕様の物理を忠実に移植）
// ------------------------------------------------------------
function sortHorses() {
  const act = horses.filter(function (h) { return h.isParticipating; });
  return act.slice().sort(function (a, b) {
    if (a.finishRank > 0 && b.finishRank > 0) return a.finishRank - b.finishRank;
    if (a.finishRank > 0) return -1;
    if (b.finishRank > 0) return 1;
    return b.d - a.d;
  });
}

function startRaceByTimer() {
  el('payout').style.display = 'none';
  isTrainingMode = false;
  isRacing = true;
  raceStartTime = frameCount;
}

function updateRace() {
  const activeHorses = horses.filter(function (h) { return h.isParticipating; });
  const sortedHorses = sortHorses();
  if (sortedHorses.length === 0) return;

  const leadHorse = sortedHorses[0];
  const raceActive = isRacing && (frameCount - raceStartTime >= 240);
  const packLeader = sortedHorses.find(function (s) { return s.runType !== '大逃げ'; }) || leadHorse;

  // リプレイ記録
  if ((isRacing || isFinished) && !isReplaying && !isPodium && !isResultFlash) {
    if (frameCount % 2 === 0) {
      replayFrames.push(horses.map(function (h) {
        return { d: h.d, laneOffset: h.laneOffset, legAngle: h.legAngle, stamina: h.stamina };
      }));
    }
  }

  // ゲート開閉
  if (raceActive && gateOpenRatio < 1.0) gateOpenRatio += 0.05;

  for (let i = 0; i < horses.length; i++) {
    const h = horses[i];
    if (!h.isParticipating) continue;
    if (isPodium) continue;

    if (!isReplaying) {
      if (raceActive && h.d < totalDistance) {
        const progress = h.d / totalDistance;
        const isStraight = progress > 0.65;
        let targetSpeed = h.baseSpeed;
        const rank = sortedHorses.indexOf(h) + 1;

        // --- スキル判定 ---
        for (const s of h.skills) {
          if (!s.used && s.cond(progress, rank)) {
            s.used = true;
            h.skillTimer = 360;
            h.skillBoost = s.boost;
            pushCommentary('★ ' + h.name + '、' + s.desc);
            h.dustTimer = 60;
          }
        }

        if (!isStraight) {
          // --- 道中：隊列と脚質で位置調整 ---
          if (h.runType === '大逃げ') {
            const distToPackLead = packLeader.d - h.d;
            const idealDist = -300;
            if (distToPackLead > idealDist + 10) targetSpeed += 1.5;
            else if (distToPackLead < idealDist - 10) targetSpeed -= 0.6;
          } else {
            const distToPackLead = packLeader.d - h.d;
            const gap = packState === '縦長' ? 14 : (packState === '横長' ? 6 : 10);
            const idealDist = h.runType === '逃げ' ? 0
                            : h.runType === '先行' ? gap
                            : h.runType === '差し' ? gap * 2.2
                            : gap * 3.2;
            if (distToPackLead > idealDist + 10) targetSpeed += 1.2;
            else if (distToPackLead < idealDist - 10) targetSpeed -= 1.0;
          }
        } else {
          // --- 直線：スパート力 × スタミナ ---
          const packBuff = (h.runType === '差し' || h.runType === '追込') ? 0.05 : -0.02;
          const effectiveGuts = h.guts / 9.0;
          targetSpeed += (h.spurtPower + packBuff) * effectiveGuts;

          if (h.runType === '大逃げ' && !h.isMonster) {
            targetSpeed -= (h.escapeType === '大' ? 0.9 : 0.4);
          }
          const distToAbsoluteLead = leadHorse.d - h.d;
          if (progress > 0.85 && distToAbsoluteLead > 100 && !h.isMonster) {
            targetSpeed += 0.8;
          }
        }

        // --- 進路取り ---
        if (isStraight && h.runType !== '逃げ' && h.runType !== '大逃げ') {
          const targetLane = -200 + (h.id * 10);
          if (h.laneOffset < targetLane) h.laneOffset += 0.167;
          else if (h.laneOffset > targetLane) h.laneOffset -= 0.167;
        } else if (!isStraight && h.laneOffset > -220) {
          h.laneOffset -= 0.267;
        }

        // --- 前方の馬との接触回避 ---
        for (let j = 0; j < horses.length; j++) {
          if (i === j) continue;
          const o = horses[j];
          if (!o.isParticipating) continue;
          const distD = o.d - h.d;
          const distLane = o.laneOffset - h.laneOffset;
          if (distD > 0 && distD < 70 && Math.abs(distLane) < 20) {
            h.speed *= 0.98;
            h.laneOffset += (distLane > 0 ? -1 : 1);
          }
        }

        // --- 直線のムチ ---
        if (isStraight) {
          if (h.whipCooldown > 0) {
            h.whipCooldown--;
          } else if (Math.random() < 0.03 && h.whipTimer <= 0) {
            h.whipTimer = 15;
            h.whipBoost = rnd(0.1, 0.4);
            h.dustTimer = 60 + Math.floor((h.whipBoost - 0.1) / 0.3 * 60);
            h.whipCooldown = h.whipTimer + 60 + ri(0, 120);
          }
          if (h.whipTimer > 0) {
            targetSpeed += h.whipBoost;
            h.whipTimer--;
          }

          // --- 差が開きすぎない制御（大逃げ有無で馬群長さを変える） ---
          if (progress > 0.6) {
            const hasOonige = sortedHorses.some(function (sh) { return sh.runType === '大逃げ'; });
            const secondH = sortedHorses.length > 1 ? sortedHorses[1] : sortedHorses[0];
            const lastH = sortedHorses[sortedHorses.length - 1];
            const gentle = 0.0006;
            // 大逃げがいる場合は最終コーナーまで15馬身（≒270）、いない場合は12馬身（≒216）
            const limitDist = (hasOonige && !isStraight) ? 270 : 216;
            if (h === leadHorse) {
              if (h.d - lastH.d > limitDist) targetSpeed -= (h.d - lastH.d - limitDist) * gentle;
            } else {
              if (leadHorse.d - h.d > limitDist) targetSpeed += (leadHorse.d - h.d - limitDist) * gentle;
            }
          }
          targetSpeed += rnd(-0.02, 0.02);
        }

        // --- スキル効果 ---
        if (h.skillTimer > 0) { targetSpeed += h.skillBoost; h.skillTimer--; }
        if (h.dustTimer > 0) h.dustTimer--;
        if (h.lateStartDelay > 0) { targetSpeed *= 0.1; h.lateStartDelay--; }

        // --- 速度更新（元仕様のイージング） ---
        h.speed += (targetSpeed - h.speed) * 0.1;
        h.laneOffset = clamp(h.laneOffset, -230, 230);
        h.speed = clamp(h.speed, 4.5, h.isMonster ? 15.75 : 14.25);

        // --- 脚質別スタミナ係数（逃げは効率よく使える） ---
        const staminaEff = h.runType === '逃げ' ? 0.65
                         : h.runType === '先行' ? 0.80
                         : h.runType === '差し' ? 1.05
                         : 1.15;  // 追込・大逃げ
        const staminaCost = ((h.speed * h.speed * 0.0025) + (h.baseSpeed * 0.008)) * staminaEff;
        h.stamina -= staminaCost;
        if (h.stamina < 0) h.stamina = 0;

        // --- 逆算：スタミナ余裕がある馬は直線前から仕掛ける ---
        const distToStraight = (trackS1 + trackC1) - h.d;
        const distToGoal = totalDistance - h.d;
        if (!h.spurtTriggered && distToStraight > 0 && distToStraight < 3600 && distToGoal > 500) {
          const estFrames = distToGoal / Math.max(4, h.speed * 0.6);
          const needStamina = ((h.speed * h.speed * 0.0025) + (h.baseSpeed * 0.008)) * staminaEff * estFrames;
          const margin = h.stamina - needStamina;
          if (margin > 0) {
            // 脚質別ボーナス（逃げ・先行は早めに強く仕掛ける）
            const spurtCap = h.runType === '逃げ' ? 1.2
                           : h.runType === '先行' ? 1.0
                           : h.runType === '差し' ? 0.75
                           : 0.60;
            const spurtBonus = Math.min(spurtCap, margin * 0.030);
            targetSpeed += spurtBonus;
            h.spurtTriggered = true;
          }
        }

        // --- スタミナ切れで失速（脚質別ペナルティ） ---
        if (h.stamina <= 0) {
          const fadeRate = h.runType === '逃げ' ? 0.72
                         : h.runType === '先行' ? 0.62
                         : h.runType === '差し' ? 0.50
                         : 0.42;  // 追込・大逃げは失速が激しい
          targetSpeed *= fadeRate;
        }

        let actualDist = h.speed * 0.6;   // 速度半分
        if (h.d >= trackS1 && h.d < trackS1 + trackC1) {
          const innerR = trackR - 200;
          const myR = trackR + h.laneOffset;
          actualDist *= (innerR / myR);
        }
        h.d += actualDist;
        h.legAngle += h.speed * 0.0333;

      } else if ((isRacing || isFinished) && h.d >= totalDistance) {
        // --- ゴール後 ---
        if (h.finishRank === 0) {
          h.finishRank = currentFinishRank++;
          const overDist = h.d - totalDistance;
          h.finishFrame = frameCount - (overDist / (h.speed * 1.2));
          // ゴールタイム（ゲートが開いてからゴールまで）
          const runFrames = Math.max(1, h.finishFrame - raceStartTime - GATE_FRAMES);
          h.finishTime = runFrames * SEC_PER_FRAME;
        }
        h.speed *= rnd(0.985, 0.995);
        h.d += h.speed * 0.6;
        h.legAngle += h.speed * 0.0333;
        if (winner === null) { winner = h; isFinished = true; }
      }
    }
  }

  // --- 全馬ゴール → リプレイへ ---
  if (isFinished && currentFinishRank > activeHorses.length && !isReplaying && !isPodium && !isResultFlash) {
    allFinishedTime++;
    if (allFinishedTime > 60) {
      isReplaying = true;
      top3Horses = sortedHorses.slice(0, 3);
      const origIdx1 = horses.indexOf(top3Horses[0]);
      const origIdx3 = horses.indexOf(top3Horses[2]);
      let firstIdx = replayFrames.length - 1;
      let thirdIdx = replayFrames.length - 1;
      for (let i = 0; i < replayFrames.length; i++) {
        if (firstIdx === replayFrames.length - 1 && replayFrames[i][origIdx1] &&
            replayFrames[i][origIdx1].d >= totalDistance) firstIdx = i;
        if (thirdIdx === replayFrames.length - 1 && replayFrames[i][origIdx3] &&
            replayFrames[i][origIdx3].d >= totalDistance) thirdIdx = i;
      }
      replayIndex = Math.max(0, firstIdx - 15);
      replayThirdIndex = thirdIdx;
    }
  }

  // --- リプレイ再生 ---
  if (isReplaying) {
    const i1 = Math.floor(replayIndex);
    const i2 = Math.min(i1 + 1, replayFrames.length - 1);
    const t = replayIndex - i1;
    if (replayFrames[i1] && replayFrames[i2]) {
      for (let i = 0; i < horses.length; i++) {
        if (!horses[i].isParticipating) continue;
        if (!replayFrames[i1][i] || !replayFrames[i2][i]) continue;
        horses[i].d = lerp(replayFrames[i1][i].d, replayFrames[i2][i].d, t);
        horses[i].laneOffset = lerp(replayFrames[i1][i].laneOffset, replayFrames[i2][i].laneOffset, t);
        horses[i].legAngle = lerp(replayFrames[i1][i].legAngle, replayFrames[i2][i].legAngle, t);
        if (replayFrames[i1][i].stamina !== undefined) {
          horses[i].stamina = lerp(replayFrames[i1][i].stamina, replayFrames[i2][i].stamina, t);
        }
      }
    }
    replayIndex += (replayIndex < replayThirdIndex + 15) ? 0.1 : 0.2;
    if (replayIndex >= replayFrames.length - 1) {
      isReplaying = false;
      isPodium = true;
      allFinishedTime = 0;
      podiumStartTime = performance.now();
      if (top3Horses[0]) {
        commentaryLog = ['★ 見事な勝利！ ' + top3Horses[0].name + 'のウイニングランです！ ' +
          (top3Horses[1] ? '2着に' + top3Horses[1].name + '、' : '') +
          (top3Horses[2] ? '3着は' + top3Horses[2].name + 'が入りました。' : '')];
        el('comment').innerHTML = commentaryLog.join('<br>');
        top3Horses[0].d = totalDistance + 100;
        top3Horses[0].laneOffset = 0;
      }
    }
  }

  // --- 表彰式のウイニングラン ---
  if (isPodium && winner) {
    winner.speed = 5.5;
    winner.d += winner.speed * 0.6;
    winner.legAngle += winner.speed * 0.0333;
    if (!prizeAwarded) settlePrize(sortedHorses);
    if (performance.now() - podiumStartTime > PODIUM_MS) {
      isPodium = false;
      showResultFlash();     // ウイニングランのあと、結果を5秒出す
    }
    return;
  }

  // --- 結果表示（5秒で次のレースへ） ---
  if (isResultFlash) {
    const left = FLASH_MS - (performance.now() - resultFlashStart);
    const cd = el('rfCount');
    if (cd) {
      cd.textContent = left > 0
        ? 'あと ' + Math.ceil(left / 1000) + ' 秒で次のレースへ'
        : '次のレースへ移ります…';
    }
    if (left <= 0) proceedToNextRace();
  }
}

}

function setPhase(np, msg) {
  if (np !== currentPhase && msg !== '') {

    pushCommentary(msg);

}

// ------------------------------------------------------------
// 7. 馬券（単勝・複勝・馬連・馬単・ワイド・3連複・3連単）
// ------------------------------------------------------------
// JRA 相当の控除率
const TAKEOUT = {
  '単勝': 0.20, '複勝': 0.20, '馬連': 0.225, '馬単': 0.25,
  'ワイド': 0.225, '3連複': 0.25, '3連単': 0.275
};

// 各馬の勝率（競馬新聞に表示してる単勝オッズと完全に同じ基準）
//   odds = 0.8 / winProb で作ってるんで、ここで逆算してもピタリ一致する。
function winProbs() {
  const raw = {};
  let sum = 0;
  horses.forEach(function (h) {
    const v = (h.winProb && h.winProb > 0) ? h.winProb : 0.8 / Math.max(1.1, h.odds);
    raw[h.id] = v;
    sum += v;
  });
  if (sum <= 0) sum = 1;
  const map = {};
  horses.forEach(function (h) { map[h.id] = raw[h.id] / sum; });
  return map;
}

// 馬券オッズを算出
function calcOdds(type, ids) {
  const pr = winProbs();
  const n = horses.length;
  function p(i) { return pr[i] || 0.001; }
  const to = 1 - (TAKEOUT[type] || 0.25);
  let prob = 0;

  if (type === '単勝') {
    // 新聞に載ってる単勝オッズをそのまま使う（表示と実購入の食い違いを防ぐ）
    const hIdx = horses.findIndex(function (h) { return h.id === ids[0]; });
    if (hIdx >= 0) return horses[hIdx].odds;
    prob = p(ids[0]);
  } else if (type === '複勝') {
    // 単勝オッズ ÷ 3 + 0.2（最低1.1）
    const hIdx = horses.findIndex(function (h) { return h.id === ids[0]; });
    let fukuOdds = hIdx >= 0 ? horses[hIdx].odds : to / p(ids[0]);
    fukuOdds = Math.max(1.1, fukuOdds / 3 + 0.2);
    fukuOdds = fukuOdds < 10 ? Math.round(fukuOdds * 10) / 10 : Math.round(fukuOdds);
    return fukuOdds;
  } else if (type === '馬連') {
    const a = ids[0], b = ids[1];
    prob = p(a) * p(b) / (1 - p(a)) + p(b) * p(a) / (1 - p(b));
  } else if (type === '馬単') {
    const a = ids[0], b = ids[1];
    prob = p(a) * p(b) / (1 - p(a));
  } else if (type === 'ワイド') {
    const a = ids[0], b = ids[1];
    const top1 = p(a) * p(b) / (1 - p(a)) + p(b) * p(a) / (1 - p(b));
    prob = Math.min(0.9, top1 * 3.1);
  } else if (type === '3連複') {
    const [a, b, c] = ids;
    const perms = [[a, b, c], [a, c, b], [b, a, c], [b, c, a], [c, a, b], [c, b, a]];
    for (const q of perms) {
      prob += p(q[0]) * (p(q[1]) / (1 - p(q[0]))) * (p(q[2]) / Math.max(0.02, 1 - p(q[0]) - p(q[1])));
    }
  } else if (type === '3連単') {
    const [a, b, c] = ids;
    prob = p(a) * (p(b) / (1 - p(a))) * (p(c) / Math.max(0.02, 1 - p(a) - p(b)));
  }

  prob = Math.max(0.00002, prob);
  let odds = to / prob;
  odds = Math.max(1.1, odds);
  // 端数を丸める（10倍未満は0.1刻み、それ以上は1刻み）
  odds = odds < 10 ? Math.round(odds * 10) / 10 : Math.round(odds);
  return odds;
}

function clearBets() { betPicksByType[betType] = []; }

function getBetPicks() {
  if (!betPicksByType[betType]) betPicksByType[betType] = [];
  return betPicksByType[betType];
}

function togglePick(id) {
  const need = BET_NEED[betType];
  const picks = getBetPicks();
  if (picks.indexOf(id) >= 0) {
    betPicksByType[betType] = picks.filter(function (x) { return x !== id; });
  } else {
    if (picks.length >= need) picks.shift();
    picks.push(id);
    betPicksByType[betType] = picks;
  }
  updatePanel();
}

function buyTicket() {
  if (isRacing || isFinished) { toast('レース中は馬券を買えへんで'); return; }
  const need = BET_NEED[betType];
  const picks = getBetPicks();
  const ready = picks.length === need && picks.every(function (x) { return x > 0; });
  if (!ready) { toast(need + '頭ぜんぶ選んでや'); return; }
  if (myMoney < betStake) { toast('所持金が足りへんで'); return; }
  const odds = calcOdds(betType, picks.slice());
  myMoney -= betStake;
  tickets.push({ type: betType, picks: picks.slice(), stake: betStake, odds: odds });
  betPicksByType[betType] = [];
  updateHUD();
  updatePanel();
}

function removeTicket(i) {
  if (isRacing || isFinished) return;
  const t = tickets[i];
  if (!t) return;
  myMoney += t.stake;
  tickets.splice(i, 1);
  updateHUD();
  updatePanel();
}

function ticketHit(t, rankOf) {
  const r = t.picks.map(function (id) { return rankOf[id]; });
  if (t.type === '単勝') return r[0] === 1;
  if (t.type === '複勝') return r[0] >= 1 && r[0] <= 3;
  if (t.type === '馬連') return r[0] <= 2 && r[1] <= 2;
  if (t.type === '馬単') return r[0] === 1 && r[1] === 2;
  if (t.type === 'ワイド') return r[0] <= 3 && r[1] <= 3;
  if (t.type === '3連複') return r[0] <= 3 && r[1] <= 3 && r[2] <= 3;
  if (t.type === '3連単') return r[0] === 1 && r[1] === 2 && r[2] === 3;
  return false;
}

function settleTickets(sorted) {
  const rankOf = {};
  sorted.forEach(function (h, i) { rankOf[h.id] = i + 1; });
  let total = 0;
  let hitCount = 0;
  let stakeTotal = 0;
  const lines = [];
  const details = [];
  tickets.forEach(function (t) {
    stakeTotal += t.stake;
    const hit = ticketHit(t, rankOf);
    const pay = hit ? Math.floor(t.stake * t.odds) : 0;
    if (hit) {
      total += pay;
      hitCount++;
      lines.push(t.type + ' ' + t.picks.join('-') + ' → ' + fmt(pay) + ' G');
    }
    details.push({
      type: t.type, picks: t.picks.slice(), stake: t.stake,
      odds: t.odds, hit: hit, pay: pay
    });
  });
  if (total > 0) myMoney += total;
  return { total: total, hits: hitCount, lines: lines, details: details, stakeTotal: stakeTotal };
}

function settlePrize(sortedHorses) {
  const raceInfo = getRaceInfo();
  const myRank = sortedHorses.findIndex(function (h) { return h.isMyHorse; });

  lastPrize = 0;
  if (myRank >= 0) {
    if (myRank === 0) { lastPrize = raceInfo.prize; if (myHorseData) myHorseData.wins++; }
    else if (myRank === 1) lastPrize = raceInfo.prize * 0.6;
    else if (myRank === 2) lastPrize = raceInfo.prize * 0.4;
    else if (myRank === 3) lastPrize = raceInfo.prize * 0.2;
    else if (myRank === 4) lastPrize = raceInfo.prize * 0.1;
  }
  if (myHorseData) myHorseData.prizeMoney = (myHorseData.prizeMoney || 0) + lastPrize;
  myMoney += lastPrize;

  // --- 一口馬主の配当（元仕様どおり上位5頭） ---
  let payout = 0;
  for (let i = 0; i < Math.min(sortedHorses.length, 5); i++) {
    const h = sortedHorses[i];
    const sh = ownedShares[h.id] || 0;
    if (sh > 0) {
      let prize = 0;
      if (i === 0) prize = raceInfo.prize;
      else if (i === 1) prize = raceInfo.prize * 0.6;
      else if (i === 2) prize = raceInfo.prize * 0.4;
      else if (i === 3) prize = raceInfo.prize * 0.2;
      else if (i === 4) prize = raceInfo.prize * 0.1;
      payout += Math.floor(prize * 0.6) * sh;
    }
  }
  if (payout > 0) { myMoney += payout; lastPayout = payout; }

  // --- 馬券の精算 ---
  const betRes = settleTickets(sortedHorses);
  lastBetResult = betRes;

  // --- 出走による能力低下と調子悪化（元仕様どおり） ---
  if (isPlayerEntered && myHorseData) {
    myHorseData.baseSpeed  = Math.max(1.0, myHorseData.baseSpeed  - rnd(0.05, 0.15));
    myHorseData.spurtPower = Math.max(1.0, myHorseData.spurtPower - rnd(0.05, 0.15));
    myHorseData.guts       = Math.max(1.0, myHorseData.guts       - rnd(0.05, 0.15));
    const idx = condIdx(myHorseData.condition);
    myHorseData.condition = COND_NAMES[Math.max(0, idx - 1)];
  }

  prizeAwarded = true;
  updateHUD();
}

let lastBetResult = { total: 0, hits: 0, lines: [], details: [], stakeTotal: 0 };
